<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>마이 프로필</title>
</head>
<body>
<!-- templates/my/profile.html -->
<div th:fragment="content">
  <h2>프로필 상세보기</h2>
  <img th:src="@{${user.profileImageUrl}}" alt="프로필 이미지" style="width: 150px; height: 150px;">
  <p><strong>등급:</strong> [[${user.grade}]]</p>
  <p><strong>평점:</strong> [[${user.rating}]]</p>
  <p><strong>후기 수:</strong> [[${user.reviewCount}]]</p>
  <p><strong>판매 목록:</strong> 링크 혹은 숫자</p>
  <p><strong>위치:</strong> [[${user.address}]] [[${user.zipNo}]] [[${user.addressDetail}]]</p>
</div>

</body>
</html>
