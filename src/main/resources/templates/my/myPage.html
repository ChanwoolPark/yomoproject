<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>마이페이지</title>
  <link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>
<body>
<div id="mypage" style="display: flex;">

  <!-- 사이드바 -->
  <div th:replace="fragments/sidebar :: sidebar"></div>

  <!-- 콘텐츠 영역 -->
  <div id="content" style="flex: 1; padding: 20px;">
    <div id="profile" class="section">👤 프로필 상세보기 내용</div>
    <div id="edit-info" class="section" style="display:none;">📝 개인정보 확인/수정</div>
    <div id="yomopay" class="section" style="display:none;">💰 요모페이 관리/충전</div>

    <div id="rents" class="section" style="display:none;">📦 대여 목록</div>
    <div id="sales" class="section" style="display:none;">🛍️ 판매 목록</div>
    <div id="cancel" class="section" style="display:none;">❌ 취소/환불/반품 내역</div>

    <div id="wishlist" class="section" style="display:none;">💖 위시리스트</div>
    <div id="recent" class="section" style="display:none;">🕵️ 최근 본 게시글</div>
    <div id="reviews" class="section" style="display:none;">✍️ 내가 쓴 리뷰</div>
    <div id="inquiries" class="section" style="display:none;">📩 문의내역 확인</div>
  </div>
</div>

<script th:src="@{/js/mypage.js}"></script>
</body>
</html>
