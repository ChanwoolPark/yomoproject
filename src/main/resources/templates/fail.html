<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="https://static.toss.im/icons/png/4x/icon-toss-logo.png" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=500, initial-scale=1.0" />
  <title>요모조모 결제실패</title>
  <style>
    :root {
      --main-blue: #465BFF;
      --light-bg: #FAFAFC;
      --yellow: #FFED7B;
      --sub-blue: #A3C9FF;
      --soft-purple: #CEC8FE;
      --font: 'Segoe UI', 'GmarketSans', 'sans-serif';
      --danger: #FF6464;
    }
    html, body {
      background: var(--light-bg);
      color: #222;
      font-family: var(--font);
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100vh;
    }
    .fail-section {
      max-width: 420px;
      margin: 70px auto 40px auto;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 6px 24px rgba(70, 91, 255, 0.06);
      padding: 38px 38px 30px 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .fail-section img {
      width: 76px;
      margin-bottom: 10px;
      filter: grayscale(0.13) brightness(1.05);
    }
    .fail-section h2 {
      font-size: 1.55rem;
      color: var(--danger);
      font-weight: 700;
      margin: 0 0 22px 0;
      letter-spacing: -1px;
    }
    .fail-info-box {
      width: 100%;
      background: var(--soft-purple);
      border-radius: 14px;
      padding: 18px 24px;
      margin-bottom: 24px;
      box-sizing: border-box;
    }
    .fail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .fail-row:last-child { margin-bottom: 0; }
    .fail-row b {
      color: var(--main-blue);
      font-size: 1.03em;
      font-weight: 600;
    }
    .fail-msg {
      word-break: break-all;
      color: #b00020;
      font-size: 0.97em;
      width: 215px;
      text-align: right;
    }
    .fail-section .button-row {
      width: 100%;
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .button-main, .button-mypage {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 14px 0;
      font-size: 1.07rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s;
    }
    .button-main {
      background: var(--main-blue);
      color: #fff;
      box-shadow: 0 1px 5px rgba(70, 91, 255, 0.06);
    }
    .button-main:hover {
      background: #273FD3;
    }
    .button-mypage {
      background: var(--yellow);
      color: var(--main-blue);
      border: 2px solid var(--main-blue);
    }
    .button-mypage:hover {
      background: #fffbe5;
    }
    @media (max-width: 520px) {
      .fail-section { padding: 18px 4vw 20px 4vw; }
      .fail-info-box { padding: 12px 2vw; }
      .fail-row b { font-size: 1em; }
    }
  </style>
</head>
<body>
<div class="fail-section">
  <img src="https://static.toss.im/lotties/error-spot-no-loop-space-apng.png" alt="실패" />
  <h2>결제를 실패했어요</h2>

  <div class="fail-info-box">
    <div class="fail-row">
      <b>에러 메시지</b>
      <span class="fail-msg" id="message"></span>
    </div>
    <div class="fail-row">
      <b>에러 코드</b>
      <span id="code"></span>
    </div>
  </div>

  <div class="button-row">
    <button class="button-main" onclick="location.href='/'">메인 화면</button>
    <button class="button-mypage" onclick="location.href='/mypage?menu=yomopay';">마이페이지</button>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  document.getElementById("code").textContent = urlParams.get("code");
  document.getElementById("message").textContent = urlParams.get("message");
</script>
</body>
</html>
