<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML 이미지 맵 예시</title>
  <style>
    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 20px auto;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

<h1>이미지 맵 사용하기</h1>
<p>아래 이미지에서 각 도형을 클릭해보세요. 다른 페이지로 이동합니다.</p>

<img src="planets.gif" alt="행성" usemap="#planets" width="400" height="400">

<map name="planets">
  <area shape="circle" coords="180,139,14" href="mercury.html" alt="수성">
  <area shape="rect" coords="0,0,82,126" href="sun.html" alt="태양">
  <area shape="poly" coords="200,200,250,200,225,250" href="triangle.html" alt="삼각형 예시">
</map>

<p>
  <strong>참고:</strong> `planets.gif`, `mercury.html`, `sun.html`, `triangle.html` 파일은 예시를 위한 가상의 파일입니다. 실제 사용 시에는 적절한 이미지와 링크를 사용해야 합니다.
</p>

</body>
</html>
