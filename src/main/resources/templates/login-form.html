<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>일반 로그인</title>
    <style>
        .login-box { max-width:400px; margin:80px auto; border:1px solid #ddd; padding:40px; border-radius:10px; }
        .login-box input { width:100%; margin-bottom:15px; padding:8px; }
        .login-box button { width:100%; padding:10px; }
        .link-row { text-align:right; margin-bottom:10px; }
        .link-row a { color:#007bff; text-decoration: underline; }
    </style>
</head>
<body>
<div style="color:red;">이 페이지는 일반 로그인 폼입니다</div>
<div class="login-box">
    <h2>일반 로그인</h2>
    <form method="post" action="/login/form">
        <input type="text" name="username" placeholder="아이디" required />
        <input type="password" name="password" placeholder="비밀번호" required />
        <div class="link-row">
            <a href="/find-id">아이디 찾기</a> | <a href="/find-password">비밀번호 찾기</a>
        </div>
        <button type="submit">로그인</button>
        <!-- 에러 메시지 표시 -->
        <div th:if="${param.error}" style="color:red; text-align:center;">
            아이디 또는 비밀번호가 잘못되었습니다.
        </div>
        <!-- 회원가입 링크 -->
        <div class="signup-section">
            아이디나 비밀번호가 없으신가요? <a href="/signup">회원가입</a>
        </div>
    </form>
</div>
</body>
</html>
