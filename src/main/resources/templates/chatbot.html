<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yomozomo 챗봇</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden; /* 페이지 전체 스크롤 방지 */
        }
        .chat-container {
            width: 100%;
            max-width: 450px; /* 데스크탑에서 최대 너비 제한 */
            height: 100vh; /* 뷰포트 전체 높이를 차지하도록 */
            background-color: #ffffff;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            display: flex;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 1px solid #eee;
            background-color: #fff;
            flex-shrink: 0; /* 헤더는 크기가 줄어들지 않도록 고정 */
        }
        .chat-header .back-arrow {
            font-size: 24px;
            color: #333;
            margin-right: 10px;
            cursor: pointer;
            text-decoration: none;
        }
        .chat-header h1 {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin: 0;
            flex-grow: 1;
            text-align: center;
        }
        .chat-body {
            flex-grow: 1; /* 메시지 영역이 남은 공간을 모두 차지하도록 */
            padding: 20px 15px; /* 좌우 패딩 조정 */
            overflow-y: auto; /* 내용이 길어지면 스크롤 가능하게 */
            -webkit-overflow-scrolling: touch; /* iOS에서 부드러운 스크롤 */
            display: flex;
            flex-direction: column;
            /* 메시지는 위에서 아래로 쌓이도록 기본 정렬 유지 */
            /* justify-content: flex-end; // 메시지를 아래에 정렬하려면 이 주석을 해제 */
        }
        .message-row {
            display: flex;
            margin-bottom: 15px; /* 메시지 줄 간 간격 */
        }
        .message-row.bot {
            justify-content: flex-start;
        }
        .message-row.user {
            justify-content: flex-end;
        }
        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px; /* 더 둥근 모서리 */
            font-size: 15px;
            line-height: 1.5;
            max-width: 75%; /* 말풍선 최대 너비 */
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); /* 은은한 그림자 */
        }
        .message-bubble.bot {
            background-color: #e6e6e6; /* 챗봇 메시지 배경 */
            color: #333;
            border-bottom-left-radius: 4px; /* 토스 UI처럼 한쪽 모서리를 덜 둥글게 */
            position: relative;
            /* 챗봇 아이콘을 위한 공간 확보 */
            margin-left: 40px; /* 챗봇 아이콘 너비 + 간격 */
        }
        .message-bubble.bot::before {
            content: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23000000" width="20px" height="20px"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>'); /* 챗봇 아이콘 SVG */
            position: absolute;
            left: -35px; /* 말풍선 왼쪽으로 이동 */
            top: 50%;
            transform: translateY(-50%);
            width: 30px; /* 아이콘 크기 */
            height: 30px;
            background-color: #f0f0f0; /* 아이콘 배경 */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .message-bubble.user {
            background-color: #2196f3; /* 사용자 메시지 배경 */
            color: white;
            border-bottom-right-radius: 4px; /* 토스 UI처럼 한쪽 모서리를 덜 둥글게 */
        }
        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }
        .message-row.bot .message-time {
            margin-right: auto; /* 챗봇 메시지 시간 왼쪽 정렬 */
            margin-left: 50px; /* 아이콘 + 버블 간격 고려 */
        }
        .message-row.user .message-time {
            margin-left: auto; /* 사용자 메시지 시간 오른쪽 정렬 */
        }


        /* 하단 고정 입력 필드 */
        .input-area {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-top: 1px solid #eee;
            background-color: #fff;
            flex-shrink: 0; /* 입력창은 크기가 줄어들지 않도록 고정 */
        }
        .input-area input[type="text"] {
            flex-grow: 1; /* 입력 필드가 남은 공간을 차지 */
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 25px; /* 아주 둥근 입력 필드 */
            font-size: 15px;
            outline: none; /* 포커스 시 아웃라인 제거 */
            margin-right: 10px;
        }
        .input-area button {
            background-color: transparent; /* 배경 없음 */
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-area button svg {
            fill: #2196f3; /* 전송 아이콘 색상 */
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <a th:href="@{/chatbot}" class="back-arrow">&#x2190;</a> <h1>Yomozomo 챗봇</h1>
    </div>

    <div th:if="${errorMessage}" class="error-message">
        <p th:text="${errorMessage}"></p>
    </div>

    <div class="chat-body" id="chatBody">
        <div class="message-row bot">
            <div class="message-bubble bot">
                <p>안녕하세요! Yomozomo 챗봇 상담이에요.</p>
                <p>무엇을 도와드릴까요?</p>
            </div>
        </div>

    </div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="궁금한 내용을 입력해주세요">
        <button id="sendMessageButton" type="submit">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>

</div>

<script th:inline="javascript">
    const messageInput = document.getElementById('messageInput');
    const sendMessageButton = document.getElementById('sendMessageButton');
    const chatBody = document.getElementById('chatBody');

    // 메시지 버블을 생성하여 채팅창에 추가하는 함수
    function addMessage(text, senderType) { // senderType: 'user' 또는 'bot'
        const messageRow = document.createElement('div');
        messageRow.classList.add('message-row', senderType);

        const messageBubble = document.createElement('div');
        messageBubble.classList.add('message-bubble', senderType);
        messageBubble.innerHTML = `<p>${text}</p>`; // HTML 태그도 포함할 수 있도록 innerHTML 사용

        // 현재 시간 추가 (선택 사항)
        // const now = new Date();
        // const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        // const messageTime = document.createElement('span');
        // messageTime.classList.add('message-time');
        // messageTime.textContent = timeString;

        messageRow.appendChild(messageBubble);
        // messageRow.appendChild(messageTime); // 시간 추가 시

        chatBody.appendChild(messageRow);
        chatBody.scrollTop = chatBody.scrollHeight; // 스크롤을 항상 최하단으로
    }

    // 메시지 전송 로직
    async function sendMessage() {
        const userMessage = messageInput.value.trim();
        if (userMessage === '') {
            return; // 빈 메시지는 전송하지 않음
        }

        addMessage(userMessage, 'user'); // 사용자 메시지를 채팅창에 추가
        messageInput.value = ''; // 입력 필드 초기화

        try {
            // Spring Boot 백엔드로 메시지 전송 (AJAX 사용)
            const response = await fetch('/chatbot/sendMessage', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded', // @RequestParam을 사용하므로 이 형식으로 보냄
                    // 'Content-Type': 'application/json', // JSON으로 보내려면 이 주석 해제하고 body를 JSON.stringify() 해야 함
                },
                body: `message=${encodeURIComponent(userMessage)}` // URL 인코딩 필수
                // body: JSON.stringify({ message: userMessage }), // JSON으로 보내려면 이 형식으로
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json(); // 백엔드에서 JSON 응답을 기대

            // 백엔드 응답에 따라 챗봇 메시지를 채팅창에 추가
            if (data.type === 'ANSWER' && data.answer && data.answer.content) {
                addMessage(data.answer.content, 'bot');
            } else if (data.type === 'QUESTION' && data.question && data.question.content) {
                // 만약 다음 질문이 있다면, 해당 질문 내용을 표시
                addMessage(data.question.content, 'bot');
                // 여기에서 다음 질문에 대한 옵션 버튼을 동적으로 생성할 수도 있습니다.
                // 그러나 현재는 텍스트 기반이므로 옵션은 표시하지 않는 것이 일반적입니다.
            } else if (data.type === 'ERROR' && data.errorMessage) {
                addMessage(`오류: ${data.errorMessage}`, 'bot');
            } else {
                addMessage("죄송합니다. 처리 중 오류가 발생했습니다.", 'bot');
            }

        } catch (error) {
            console.error('Error sending message:', error);
            addMessage("메시지 전송 중 오류가 발생했습니다.", 'bot');
        }
    }

    // 엔터 키 입력 시 메시지 전송
    messageInput.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    });

    // 전송 버튼 클릭 시 메시지 전송
    sendMessageButton.addEventListener('click', sendMessage);

    // 초기 로드 시 챗봇 메시지를 아래로 정렬
    window.onload = function() {
        chatBody.scrollTop = chatBody.scrollHeight;
    };

</script>
</body>
</html>
