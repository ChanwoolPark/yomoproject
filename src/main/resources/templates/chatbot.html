<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yomozomo 챗봇</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden; /* 페이지 전체 스크롤 방지 */
        }
        .chat-container {
            width: 100%;
            max-width: 450px; /* 데스크탑에서 최대 너비 제한 */
            height: 100vh; /* 뷰포트 전체 높이를 차지하도록 */
            background-color: #ffffff;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            display: flex;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 1px solid #eee;
            background-color: #fff;
            flex-shrink: 0; /* 헤더는 크기가 줄어들지 않도록 고정 */
        }
        .chat-header .back-arrow {
            font-size: 24px;
            color: #333;
            margin-right: 10px;
            cursor: pointer;
            text-decoration: none;
        }
        .chat-header h1 {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin: 0;
            flex-grow: 1;
            text-align: center;
        }
        .chat-body {
            flex-grow: 1; /* 메시지 영역이 남은 공간을 모두 차지하도록 */
            padding: 20px 15px; /* 좌우 패딩 조정 */
            overflow-y: auto; /* 내용이 길어지면 스크롤 가능하게 */
            -webkit-overflow-scrolling: touch; /* iOS에서 부드러운 스크롤 */
            display: flex;
            flex-direction: column;
        }
        .message-row {
            display: flex;
            margin-bottom: 15px; /* 메시지 줄 간 간격 */
        }
        .message-row.bot {
            justify-content: flex-start;
        }
        .message-row.user {
            justify-content: flex-end;
        }
        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px; /* 더 둥근 모서리 */
            font-size: 15px;
            line-height: 1.5;
            max-width: 75%; /* 말풍선 최대 너비 */
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); /* 은은한 그림자 */
        }
        .message-bubble.bot {
            background-color: #e6e6e6; /* 챗봇 메시지 배경 */
            color: #333;
            border-bottom-left-radius: 4px; /* 토스 UI처럼 한쪽 모서리를 덜 둥글게 */
            position: relative;
            /* 챗봇 아이콘을 위한 공간 확보 */
            margin-left: 40px; /* 챗봇 아이콘 너비 + 간격 */
        }
        .message-bubble.bot::before {
            content: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23000000" width="20px" height="20px"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>'); /* 챗봇 아이콘 SVG */
            position: absolute;
            left: -35px; /* 말풍선 왼쪽으로 이동 */
            top: 50%;
            transform: translateY(-50%);
            width: 30px; /* 아이콘 크기 */
            height: 30px;
            background-color: #f0f0f0; /* 아이콘 배경 */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .message-bubble.user {
            background-color: #2196f3; /* 사용자 메시지 배경 */
            color: white;
            border-bottom-right-radius: 4px; /* 토스 UI처럼 한쪽 모서리를 덜 둥글게 */
        }
        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }
        .message-row.bot .message-time {
            margin-right: auto; /* 챗봇 메시지 시간 왼쪽 정렬 */
            margin-left: 50px; /* 아이콘 + 버블 간격 고려 */
        }
        .message-row.user .message-time {
            margin-left: auto; /* 사용자 메시지 시간 오른쪽 정렬 */
        }

        /* 하단 고정 입력 필드 */
        .input-area {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-top: 1px solid #eee;
            background-color: #fff;
            flex-shrink: 0; /* 입력창은 크기가 줄어들지 않도록 고정 */
        }
        .input-area input[type="text"] {
            flex-grow: 1; /* 입력 필드가 남은 공간을 차지 */
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 25px; /* 아주 둥근 입력 필드 */
            font-size: 15px;
            outline: none; /* 포커스 시 아웃라인 제거 */
            margin-right: 10px;
        }
        .input-area button {
            background-color: transparent; /* 배경 없음 */
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-area button svg {
            fill: #2196f3; /* 전송 아이콘 색상 */
            width: 24px;
            height: 24px;
        }

        /* 링크 스타일 */
        .message-bubble a {
            display: block; /* 링크를 새 줄에 표시 */
            margin-top: 10px; /* 위에 여백 주기 */
            color: #1a73e8; /* 링크 색상 (챗봇 버블용) */
            text-decoration: underline; /* 밑줄 */
            font-weight: bold; /* 볼드체 */
            word-break: break-word; /* 긴 URL이 버블 밖으로 나가지 않도록 */
        }
        .message-bubble.user a {
            color: white; /* 사용자 버블 내 링크 색상 */
        }

        /* --- 추가된 스타일 시작 (추천 키워드 버튼) --- */
        .suggested-keywords-container {
            display: flex;
            flex-wrap: wrap; /* 키워드가 많을 경우 줄 바꿈 */
            gap: 8px; /* 키워드 버튼 간 간격 */
            margin-top: 10px;
            margin-bottom: 10px; /* 입력 필드와의 간격 */
            justify-content: flex-start; /* 챗봇 메시지처럼 왼쪽 정렬 */
        }

        .keyword-button {
            background-color: #e0f2f7; /* 연한 파란색 배경 */
            border: 1px solid #b3e5fc; /* 테두리 */
            border-radius: 20px; /* 둥근 버튼 */
            padding: 8px 15px;
            font-size: 14px;
            color: #01579b; /* 진한 파란색 텍스트 */
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap; /* 텍스트가 줄 바꿈되지 않도록 */
        }
        .keyword-button:hover {
            background-color: #b3e5fc;
        }
        /* --- 추가된 스타일 끝 --- */
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <a th:href="@{/}" class="back-arrow">&#x2190;</a> <h1>Yomozomo 챗봇</h1>
    </div>

    <div th:if="${errorMessage}" class="error-message">
        <p th:text="${errorMessage}"></p>
    </div>

    <div class="chat-body" id="chatBody">
    </div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="궁금한 내용을 입력해주세요">
        <button id="sendMessageButton" type="submit">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>

</div>

<script th:inline="javascript">
    const messageInput = document.getElementById('messageInput');
    const sendMessageButton = document.getElementById('sendMessageButton');
    const chatBody = document.getElementById('chatBody');

    /**
     * 메시지 버블을 생성하여 채팅창에 추가하는 함수.
     * 챗봇 메시지에 링크를 포함할 수 있도록 linkUrl과 linkText 인자를 받습니다.
     * @param {string} content - 메시지 내용
     * @param {string} senderType - 'user' 또는 'bot'
     * @param {string|null} [linkUrl=null] - 링크 URL (옵션)
     * @param {string|null} [linkText=null] - 링크 텍스트 (옵션)
     */
    function addMessage(content, senderType, linkUrl = null, linkText = null) {
        const messageRow = document.createElement('div');
        messageRow.classList.add('message-row', senderType);

        const messageBubble = document.createElement('div');
        messageBubble.classList.add('message-bubble', senderType);

        // 기본 텍스트 내용 추가
        const contentParagraph = document.createElement('p');
        contentParagraph.textContent = content; // textContent 사용으로 XSS 방지
        messageBubble.appendChild(contentParagraph);

        // 링크가 있다면 링크 엘리먼트 추가
        if (linkUrl && linkText) {
            const linkElement = document.createElement('a');
            linkElement.href = linkUrl;
            linkElement.textContent = linkText;
            linkElement.target = '_blank'; // 새 탭에서 열기 (보안 권장)
            linkElement.rel = 'noopener noreferrer'; // 새 탭 보안 강화

            messageBubble.appendChild(linkElement);
        }

        messageRow.appendChild(messageBubble);
        chatBody.appendChild(messageRow);
        chatBody.scrollTop = chatBody.scrollHeight; // 스크롤을 항상 최하단으로
    }

    /**
     * 추천 키워드 버튼을 생성하여 채팅창에 추가하는 함수
     * @param {Array<string>} keywords - 추천 키워드 문자열 배열
     */
    function addSuggestedKeywords(keywords) {
        const keywordsContainer = document.createElement('div');
        keywordsContainer.classList.add('suggested-keywords-container');

        keywords.forEach(keyword => {
            const keywordButton = document.createElement('button');
            keywordButton.classList.add('keyword-button');
            keywordButton.textContent = keyword;

            keywordButton.addEventListener('click', function() {
                // 클릭 시 해당 키워드로 메시지 전송
                messageInput.value = keyword;
                sendMessage();
                // 키워드 버튼 클릭 후 해당 키워드들이 다시 나타나지 않도록 컨테이너를 지울 수도 있습니다.
                keywordsContainer.remove(); // 이 줄을 추가하면 클릭 후 버튼 사라짐
            });
            keywordsContainer.appendChild(keywordButton);
        });
        chatBody.appendChild(keywordsContainer);
        chatBody.scrollTop = chatBody.scrollHeight; // 스크롤 최하단으로
    }

    // 메시지 전송 로직
    async function sendMessage() {
        const userMessage = messageInput.value.trim();
        if (userMessage === '') {
            return; // 빈 메시지는 전송하지 않음
        }

        addMessage(userMessage, 'user'); // 사용자 메시지를 채팅창에 추가
        messageInput.value = ''; // 입력 필드 초기화

        try {
            // Spring Boot 백엔드로 메시지 전송 (AJAX 사용)
            const response = await fetch('/chatbot/send?message=' + encodeURIComponent(userMessage), {
                method: 'GET',
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json(); // 백엔드에서 JSON 응답을 기대

            // 백엔드 응답에 따라 챗봇 메시지를 채팅창에 추가
            if (data.type === 'ANSWER' && data.answer && data.answer.content) {
                // linkUrl과 linkText는 없을 수도 있으므로 기본값 null 처리
                const linkUrl = data.answer.linkUrl || null;
                const linkText = data.answer.linkText || null;
                addMessage(data.answer.content, 'bot', linkUrl, linkText);
                // 추천 키워드가 있다면 표시
                if (data.suggestedKeywords && data.suggestedKeywords.length > 0) {
                    addSuggestedKeywords(data.suggestedKeywords);
                }
            } else if (data.type === 'QUESTION' && data.question) {
                addMessage(data.question, 'bot');
                // 질문과 함께 추천 키워드가 있다면 표시
                if (data.suggestedKeywords && data.suggestedKeywords.length > 0) {
                    addSuggestedKeywords(data.suggestedKeywords);
                }
            } else if (data.type === 'ERROR' && data.errorMessage) {
                addMessage(`오류: ${data.errorMessage}`, 'bot');
                // 오류 메시지와 함께 추천 키워드가 있다면 표시
                if (data.suggestedKeywords && data.suggestedKeywords.length > 0) {
                    addSuggestedKeywords(data.suggestedKeywords);
                }
            } else {
                addMessage("죄송합니다. 처리 중 오류가 발생했습니다.", 'bot');
            }

        } catch (error) {
            console.error('Error sending message:', error);
            addMessage("메시지 전송 중 오류가 발생했습니다.", 'bot');
        }
    }

    // 초기 메시지를 로드하는 함수
    async function loadInitialMessage() {
        try {
            const response = await fetch('/chatbot/init', {
                method: 'GET'
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json(); // 백엔드에서 JSON 응답을 기대

            if (data.type === 'ANSWER' && data.answer && data.answer.content) {
                // 초기 메시지도 링크를 포함할 수 있도록 전달
                const linkUrl = data.answer.linkUrl || null;
                const linkText = data.answer.linkText || null;
                addMessage(data.answer.content, 'bot', linkUrl, linkText);
                // 초기 메시지와 함께 추천 키워드가 있다면 표시
                if (data.suggestedKeywords && data.suggestedKeywords.length > 0) {
                    addSuggestedKeywords(data.suggestedKeywords);
                }
            } else if (data.type === 'QUESTION' && data.question) {
                addMessage(data.question, 'bot');
                // 초기 질문과 함께 추천 키워드가 있다면 표시
                if (data.suggestedKeywords && data.suggestedKeywords.length > 0) {
                    addSuggestedKeywords(data.suggestedKeywords);
                }
            } else {
                addMessage("챗봇을 시작할 수 없습니다. 잠시 후 다시 시도해주세요.", 'bot');
            }
        } catch (error) {
            console.error('Error loading initial message:', error);
            addMessage("초기 메시지를 가져오는 데 실패했습니다.", 'bot');
        }
    }

    // 엔터 키 입력 시 메시지 전송
    messageInput.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    });

    // 전송 버튼 클릭 시 메시지 전송
    sendMessageButton.addEventListener('click', sendMessage);

    // 페이지 로드 시 초기 메시지 로드 및 스크롤 최하단으로
    window.onload = function() {
        loadInitialMessage(); // 초기 메시지 로드
        // 초기 메시지가 로드된 후에 스크롤을 최하단으로 이동시켜야 합니다.
        // 비동기 작업이므로, loadInitialMessage 내에서 스크롤 로직을 호출하거나,
        // 간단히 여기에 setTimeout을 사용하여 약간의 지연을 줄 수도 있습니다.
        setTimeout(() => {
            chatBody.scrollTop = chatBody.scrollHeight;
        }, 100); // 100ms 지연
    };

</script>
</body>
</html>
