<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅방</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- 폰트/아이콘 등 필요한 리소스 추가 (필요시) -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>

    </style>
</head>
<body>
<button class="button p-grid-col5" onclick="location.href='http://localhost:8080';">메인 화면</button>
<div class="chat-container">
    <div class="chat-header">
        <img id="chatPartnerProfileImage" class="profile-image-header left" th:src="${chatPartnerProfileImage}" alt="상대방 프로필">
        <h3 id="chatHeader">
            <p>
                <span th:if="${chatPartnerNickname != null}" th:text="${chatPartnerNickname + '님과의 채팅'}">[상대방 닉네임]</span>
                <span th:unless="${chatPartnerNickname != null}">채팅방 <span th:text="${currentRentalId}">[렌탈 ID]</span></span>
            </p>
        </h3>
        <img id="myUserProfileImage" class="profile-image-header right" th:src="${currentUserProfileImage}" alt="내 프로필">
    </div>

    <div class="chat-messages" id="chatMessages">
        <!-- 서버 사이드 렌더링 메시지 기록 (선택적) -->
        <div th:each="message : ${chatHistory}"
             th:classappend="${message.messageType == 'JOIN' or message.messageType == 'LEAVE' ? 'event-message' : (message.senderId == currentUserId ? 'sent' : 'received')}"
             class="message-wrapper">
            <span class="sender-name"
                  th:if="${(message.senderId != currentUserId) and (message.messageType != 'JOIN') and (message.messageType != 'LEAVE')}"
                  th:text="${message.senderName}"></span>
            <div class="message-content">
                <th:block th:if="${message.messageType == 'IMAGE'}">
                    <img th:src="${message.imgUrl}"
                         th:alt="${message.message ?: '전송된 이미지'}"
                         style="max-width: 250px; height: auto; border-radius: 8px;">
                    <span th:if="${message.message != null and message.message.trim() != ''}"
                          th:text="${message.message}"
                          style="display: block; margin-top: 5px;"></span>
                </th:block>
                <th:block th:unless="${message.messageType == 'IMAGE'}">
                    <th:block th:text="${message.message}"></th:block>
                </th:block>
            </div>
            <div class="message-time"
                 th:text="${message.sendTime != null ? #temporals.format(message.sendTime, 'HH:mm') : '시간 없음'}"></div>
        </div>
    </div>

    <div class="chat-input-area">
        <div class="input-and-send">
            <label for="messageInput"></label>
            <input type="text" id="messageInput" placeholder="메시지를 입력하세요...">
            <button id="sendMessageBtn" class="send-button">
                <span class="material-icons">send</span>
            </button>
        </div>
        <input type="file" id="fileInput" style="display: none;">
        <div class="input-toolbar">
            <button id="togglePanelBtn" title="거래 메뉴"><span class="material-icons">add_circle</span></button>
            <button id="button2" title="파일 첨부"><span class="material-icons">attach_file</span></button>
            <button id="button3" title="달력 / 일정"><span class="material-icons">event</span></button>
            <button id="button4" title="신고 / 문의"><span class="material-icons">report_problem</span></button>
        </div>
    </div>

    <div class="expanded-panel">
        <div class="panel-header">
            <button id="closePanelBtn"><span class="material-icons">close</span></button>
        </div>
        <div class="inner-buttons-grid">
            <div class="grid-item-full">
                <button id="paymentGoBtn" title="결제하기">
                    <span class="icon material-icons">credit_card</span>결제하기
                </button>
            </div>
            <div class="grid-item-half">
                <button id="innerButton2" title="금액 조절">
                    <span class="icon material-icons">currency_exchange</span>금액 조절
                </button>
            </div>
            <div class="grid-item-half">
                <button id="tradeCompleteBtn" title="거래완료">
                    <span class="icon material-icons">check_circle</span>거래완료
                </button>
            </div>
        </div>
        <div class="panel-content-wrapper">
            <div id="defaultPanelContent" class="panel-content-section active-panel-section">
                <h4>추가 기능</h4>
                <p>거래와 관련된 추가 기능을 사용해보세요.</p>
            </div>
            <div id="paymentPanelContent" class="panel-content-section">
                <h4>결재 정보 입력</h4>
                <label for="paymentAmount">결재 금액:</label>
                <input type="number" id="paymentAmount" value="0" min="0" placeholder="결재할 금액을 입력하세요">
                <button id="processPaymentBtn">결재 진행</button>
            </div>
            <div id="priceAdjustmentPanelContent" class="panel-content-section">
                <h4>금액 조절</h4>
                <label for="newPriceInputPanel">새로운 금액을 입력하세요:</label>
                <input type="number" id="newPriceInputPanel" name="newPrice" min="0" placeholder="예: 25000">
                <div class="panel-buttons">
                    <button id="confirmPricePanelBtn">확인</button>
                    <button id="cancelPricePanelBtn">취소</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 이미지 모달 (필요시) -->
<div id="imageModal" class="image-modal-overlay">
    <div class="image-modal-content">
        <span class="image-modal-close material-icons" onclick="closeImageModal()">&times;</span>
        <img id="modalImage" src="" alt="확대된 이미지">
    </div>
</div>

<script src="/webjars/sockjs-client/sockjs.min.js"></script>
<script src="/webjars/stomp-websocket/stomp.min.js"></script>
<script th:inline="javascript">
    // ======================== 변수 및 패널 함수 (첫 번째 코드 중심, 기능 병합) ========================
    let stompClient = null;
    let chatMessagesDiv, messageInput, sendMessageBtn, togglePanelBtn, closePanelBtn;
    let expandedPanel, defaultPanelContent, paymentPanelContent, processPaymentBtn, paymentAmountInput;
    let priceAdjustmentPanelContent, newPriceInputPanel, confirmPricePanelBtn, cancelPricePanelBtn;
    let paymentGoBtn, innerButton2, tradeCompleteBtn, innerButtonsGrid;
    let fileInput, attachmentButton, reportButton;
    let hasSentJoinMessage = false;

    // Thymeleaf 변수
    const chatRoomId = /*[[${chatRoomId}]]*/ 0;
    const currentUserId = /*[[${currentUserId}]]*/ 0;
    const currentRentalId = /*[[${currentRentalId}]]*/ '';
    const chatPartnerId = /*[[${chatPartnerId}]]*/ 0;
    const currentUserName = /*[[${currentUserName}]]*/ '나';
    const chatPartnerNickname = /*[[${chatPartnerNickname}]]*/ '상대방';
    const currentUserProfileImage = /*[[${currentUserProfileImage}]]*/ '/images/default_profile.png';
    const chatPartnerProfileImage = /*[[${chatPartnerProfileImage}]]*/ '/images/default_profile.png';

    document.addEventListener('DOMContentLoaded', function() {
        chatMessagesDiv = document.getElementById('chatMessages');
        messageInput = document.getElementById('messageInput');
        sendMessageBtn = document.getElementById('sendMessageBtn');
        togglePanelBtn = document.getElementById('togglePanelBtn');
        closePanelBtn = document.getElementById('closePanelBtn');
        expandedPanel = document.querySelector('.expanded-panel');
        defaultPanelContent = document.getElementById('defaultPanelContent');
        paymentPanelContent = document.getElementById('paymentPanelContent');
        priceAdjustmentPanelContent = document.getElementById('priceAdjustmentPanelContent');
        processPaymentBtn = document.getElementById('processPaymentBtn');
        paymentAmountInput = document.getElementById('paymentAmount');
        newPriceInputPanel = document.getElementById('newPriceInputPanel');
        confirmPricePanelBtn = document.getElementById('confirmPricePanelBtn');
        cancelPricePanelBtn = document.getElementById('cancelPricePanelBtn');
        paymentGoBtn = document.getElementById('paymentGoBtn');
        innerButton2 = document.getElementById('innerButton2');
        tradeCompleteBtn = document.getElementById('tradeCompleteBtn');
        innerButtonsGrid = document.querySelector('.inner-buttons-grid');
        attachmentButton = document.getElementById('button2');
        reportButton = document.getElementById('button4');
        fileInput = document.getElementById('fileInput');

        // 이벤트 리스너 (첫 번째 코드 구조 기준)
        if (sendMessageBtn) sendMessageBtn.addEventListener('click', sendMessage);
        if (messageInput) messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
        if (togglePanelBtn) togglePanelBtn.addEventListener('click', () => toggleExpandedPanel());
        if (closePanelBtn) closePanelBtn.addEventListener('click', () => toggleExpandedPanel(false));
        if (attachmentButton) attachmentButton.addEventListener('click', () => fileInput && fileInput.click());
        if (fileInput) fileInput.addEventListener('change', handleFileUpload);
        if (reportButton) reportButton.addEventListener('click', () => window.open(`/report/new/${chatRoomId}?reporterId=${currentUserId}&reportedId=${chatPartnerId}`, '_blank'));

        if (paymentGoBtn) paymentGoBtn.addEventListener('click', () => {
            if (currentRentalId) {
                toggleExpandedPanel(false);
                window.location.href = '/payment/' + currentRentalId;
            } else alert('렌탈 정보가 없어 결제 페이지로 이동할 수 없습니다.');
        });

        if (innerButton2) innerButton2.addEventListener('click', () => showPanelSection(priceAdjustmentPanelContent, true));
        if (tradeCompleteBtn) tradeCompleteBtn.addEventListener('click', () => {
            if (!isSeller) {
                alert('거래완료는 판매자만 가능합니다.\n문제가 있는 경우 고객센터나 신고하기를 이용해주세요.');
                return;
            }
            fetch('/payment/complete/' + currentRentalId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            }).then(res => {
                if(res.ok) {
                    alert('거래가 정상적으로 완료되었습니다.');
                    location.reload();
                } else res.text().then(msg => alert(msg));
            });
        });

        if (processPaymentBtn) processPaymentBtn.addEventListener('click', () => {
            const amount = paymentAmountInput.value;
            alert(`결재 금액: ${amount}원 (실제 결재 로직 필요)`);
            toggleExpandedPanel(false);
        });

        if (confirmPricePanelBtn) confirmPricePanelBtn.addEventListener('click', () => {
            const newPrice = parseInt(newPriceInputPanel.value, 10);
            if (!newPrice || newPrice <= 0) { alert('유효한 금액을 입력하세요.'); return; }
            fetch(`/api/rental/${currentRentalId}/price`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newPrice: newPrice })
            })
                .then(res => {
                    if (!res.ok) return res.text().then(msg => { throw new Error(msg); });
                    return res.json();
                })
                .then(data => {
                    paymentAmountInput.value = newPrice;
                    alert('금액이 변경되었습니다!');
                    showPanelSection(defaultPanelContent, false);
                })
                .catch(e => alert(e.message || '금액 변경 실패(권한/서버오류)'));
        });
        if (cancelPricePanelBtn) cancelPricePanelBtn.addEventListener('click', () => showPanelSection(defaultPanelContent, false));

        showPanelSection(defaultPanelContent, false);
        connect();
    });

    // ======================== 패널 제어 함수 ========================
    function showPanelSection(sectionToShow, hideButtons = false) {
        document.querySelectorAll('.panel-content-section').forEach(section => section.classList.remove('active-panel-section'));
        if (sectionToShow) sectionToShow.classList.add('active-panel-section');
        if (innerButtonsGrid) innerButtonsGrid.style.display = hideButtons ? 'none' : 'grid';
    }
    function toggleExpandedPanel(show) {
        const isPanelCurrentlyActive = expandedPanel.classList.contains('active');
        const shouldShow = show === undefined ? !isPanelCurrentlyActive : show;
        if (shouldShow) {
            expandedPanel.classList.add('active');
            showPanelSection(defaultPanelContent, false);
        } else {
            expandedPanel.classList.remove('active');
            showPanelSection(null);
            if (innerButtonsGrid) innerButtonsGrid.style.display = 'grid';
        }
        // 패딩, 스크롤 처리 등 필요하면 추가
    }

    // ======================== WebSocket 연결 및 메시지 ========================
    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function(frame) {
            stompClient.subscribe(`/sub/chat/room/${chatRoomId}`, function(messageOutput) {
                showMessage(JSON.parse(messageOutput.body));
            });
            // 최초 입장 메시지 필요하면 여기에 sendJoinMessage() 호출
        }, function(error) {
            console.error('STOMP 연결 오류:', error);
        });
    }
    function sendMessage(customMessageContent = null) {
        let messageContent = customMessageContent ? customMessageContent.trim() : messageInput.value.trim();
        if (messageContent) {
            const chatMessage = {
                roomId: chatRoomId,
                senderId: currentUserId,
                message: messageContent,
                messageType: 'TALK'
            };
            if (stompClient && stompClient.connected) {
                stompClient.send(`/pub/chat.sendMessage/${chatRoomId}`, {}, JSON.stringify(chatMessage));
                if (!customMessageContent) messageInput.value = '';
            } else {
                alert('채팅 서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.');
            }
        }
    }
    function showMessage(message) {
        if (!chatMessagesDiv) return;
        const messageWrapper = document.createElement('div');
        messageWrapper.classList.add('message-wrapper');
        if (message.messageType === 'JOIN' || message.messageType === 'LEAVE') {
            messageWrapper.classList.add('event-message');
        } else if (message.senderId === currentUserId) {
            messageWrapper.classList.add('sent');
        } else {
            messageWrapper.classList.add('received');
        }
        // senderName 표시(상대방 메시지일 때)
        if (message.senderId !== currentUserId && message.senderName) {
            const senderNameElement = document.createElement('span');
            senderNameElement.classList.add('sender-name');
            senderNameElement.textContent = message.senderName;
            messageWrapper.appendChild(senderNameElement);
        }
        const messageContent = document.createElement('div');
        messageContent.classList.add('message-content');
        // 이미지 메시지 지원
        if (message.messageType === 'IMAGE' && message.imgUrl) {
            const imgElement = document.createElement('img');
            imgElement.src = message.imgUrl;
            imgElement.alt = message.message || "전송된 이미지";
            imgElement.style.maxWidth = '250px';
            imgElement.style.height = 'auto';
            imgElement.style.borderRadius = '8px';
            imgElement.onclick = () => openImageModal(imgElement.src);
            messageContent.appendChild(imgElement);
            if (message.message && message.message.trim() !== '') {
                const textSpan = document.createElement('span');
                textSpan.textContent = message.message;
                textSpan.style.display = 'block';
                textSpan.style.marginTop = '5px';
                messageContent.appendChild(textSpan);
            }
        } else {
            messageContent.textContent = message.message;
        }
        messageWrapper.appendChild(messageContent);

        const messageTime = document.createElement('div');
        messageTime.classList.add('message-time');
        if (message.sendTime) {
            const date = new Date(message.sendTime);
            if (!isNaN(date)) {
                messageTime.text
