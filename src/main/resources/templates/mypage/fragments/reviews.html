<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내가 쓴 리뷰</title>
    <style>
        .review-section {
            background: #fff;
            border-radius: 2rem;
            box-shadow: var(--card-shadow);
            border: 1.2px solid var(--card-border);
            padding: 36px 38px 30px 38px;
            margin-bottom: 32px;
        }

        .review-section h3 {
            font-size: 1.34em;
            font-weight: 800;
            color: #222;
            margin-bottom: 20px;
        }

        .review-card {
            border-bottom: 1px dashed #eee;
            padding: 16px 0;
        }

        .review-card:last-child {
            border-bottom: none;
        }

        .review-meta {
            margin-bottom: 6px;
        }

        .product-link, .card-link {
            display: inline-block;
            font-size: 0.97rem;
            font-weight: 600;
            color: #4a90e2;
            text-decoration: none;
            margin-right: 10px;
        }

        .product-link:hover, .card-link:hover {
            text-decoration: underline;
        }

        .review-text {
            font-size: 0.96rem;
            color: #333;
            margin-bottom: 4px;
        }

        .review-date {
            font-size: 0.85rem;
            color: #888;
        }

        .empty-msg {
            padding: 24px;
            text-align: center;
            background: #fafbfd;
            border-radius: 1.4rem;
            border: 1px solid #f0eefb;
            box-shadow: 0 1px 6px #a3c9ff12;
            font-size: 0.98rem;
            color: #999;
        }
    </style>
</head>
<body>

<div class="review-section">
    <h3>📝 내가 쓴 리뷰</h3>

    <div th:if="${#lists.isEmpty(myWrittenReviews)}" class="empty-msg">
        아직 내가 작성한 리뷰가 없습니다.
    </div>

    <div th:each="review : ${myWrittenReviews}" class="review-card">
        <div class="review-meta">
            <a th:href="@{'/product/' + ${review.product.productId}}"
               class="product-link"
               th:text="'[' + ${review.product.title} + ']'">[상품명]</a>
            <a th:href="@{'/mypage/profile/' + ${review.target.username}}"
               class="card-link"
               th:text="'[대상] ' + ${review.target.name}">[대상자]</a>
        </div>
        <div class="review-text" th:text="${review.reviewText}">리뷰 내용</div>
        <div class="review-date" th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd')}">작성일</div>
    </div>
</div>

</body>
</html>
