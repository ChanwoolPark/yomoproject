<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내가 쓴 리뷰</title>
    <style>
        .list-title {
            font-size: 16px;
            margin-bottom: 10px;
            margin-top: 22px;
        }
        .card-box {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 16px;
            background: #fafbfc;
            box-shadow: 0 2px 8px 0 rgba(0,0,0,0.03);
        }
        .card-link {
            color: #4a90e2;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
        }
        .product-link {
            color: #7c4dff;
            text-decoration: underline;
            font-size: 15px;
            font-weight: 600;
            margin-right: 8px;
            cursor: pointer;
        }
        .review-meta {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<div class="my-reviews-section">
    <h3 class="list-title">내가 쓴 리뷰</h3>
    <div th:if="${#lists.isEmpty(myWrittenReviews)}" class="card-box">
        아직 내가 작성한 리뷰가 없습니다.
    </div>
    <div th:each="review : ${myWrittenReviews}" class="card-box">
        <div class="review-meta">
            <!-- 상품명(상세로), 대상자(프로필로) 둘 다 링크 -->
            <a th:href="@{'/product/' + ${review.product.productId}}"
               class="product-link"
               th:text="'[' + ${review.product.title} + ']'"></a>
            <a th:href="@{'/mypage/profile/' + ${review.target.username}}"
               class="card-link"
               th:text="'[대상] ' + ${review.target.name}"></a>
        </div>
        <p th:text="${review.reviewText}" style="margin: 6px 0 2px;"></p>
        <small th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd')}" style="color: #888;">날짜</small>
    </div>
</div>
</body>
</html>
