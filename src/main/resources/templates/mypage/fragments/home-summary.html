<div th:fragment="content">

  <!-- 프로필 카드 -->
  <div class="yomo-card profile-card">
    <img th:src="${user.profileImageUrl} != null ? ${user.profileImageUrl} : '/images/default-profile.png'" alt="프로필 이미지" class="profile-img"
         onerror="this.onerror=null;this.src='/images/default-profile.png';">

    <div>
      <div class="profile-main-row">
        <strong th:text="${user.grade}" class="profile-grade">BRONZE</strong>
        <span th:text="${user.nickname}" class="profile-nickname">누나</span>
        <span class="profile-hi">님 환영해요! <span style="font-size:1.12em;">👋</span></span>
      </div>
      <div class="profile-points">
      <span class="profile-point-badge">
        <span style="font-size:1.08em;">🪙</span> 요모포인트 <span th:text="${point}">1000</span> p
      </span>
        <span class="profile-coupon-badge">
        <span style="font-size:1.07em;">🎟️</span> 쿠폰 <strong th:text="${user.couponCount}">3</strong>장
      </span>
      </div>
      <div class="profile-btn-row">
        <button type="button" onclick="loadContent('profile')" class="yomo-btn">
          프로필 상세보기 <span class="profile-btn-arrow">→</span>
        </button>
      </div>
    </div>
  </div>
  <hr class="yomo-break">

  <!-- 최근 본 상품 -->
  <div class="yomo-card">
    <h3>👀 최근 본 상품</h3>
    <div th:if="${#lists.isEmpty(recentlyViewed)}">
      <p style="color:#888; font-size:0.99em; margin:14px 0 22px 8px;">최근 본 상품이 없습니다.</p>
    </div>
    <div th:if="${!#lists.isEmpty(recentlyViewed)}" class="recent-list-row">
      <div th:each="item : ${recentlyViewed}" class="mini-box recent-item-box">
        <a th:href="@{'/product/' + ${item.product.productId}}">
          <img th:src="${item.product.thumbnailUrl}" alt="최근 본 이미지"
               class="recent-img"><br>
          <span th:text="${item.product.title}" class="recent-title"></span>
        </a>
      </div>
    </div>
    <div style="margin-top: 10px;">
      <a href="/mypage/recent" style="font-size: 0.98em; font-weight:600;">전체 보기 →</a>
    </div>
  </div>
  <hr class="yomo-break">

  <!-- 대여 목록 -->
  <div class="yomo-card">
    <h3>🛒 대여 목록</h3>
    <div th:if="${#lists.isEmpty(myRentalList)}">
      <p style="color:#888; font-size:0.98em; margin:14px 0 22px 8px;">진행 중인 대여가 없습니다.</p>
    </div>
    <div th:if="${!#lists.isEmpty(myRentalList)}" class="rental-list-row">
      <div th:each="rental : ${myRentalList}" class="mini-box rental-item-box">
        <img th:src="${rental.product.thumbnailUrl} != null ? ${rental.product.thumbnailUrl} : '/images/no-image.png'"
             alt="상품 이미지" class="rental-img"
             onerror="this.onerror=null;this.src='/images/no-image.png';">
        <div>
          <div class="rental-title">
            <a th:href="@{'/product/' + ${rental.product.productId}}"
               th:text="${rental.product.title}">상품명</a>
          </div>
          <div class="rental-status">
            <div class="rental-status">
              <span th:text="'상태: ' + ${rental.status}"
                th:classappend="
                  ${rental.status} == '대여중' ? 'status-ing' :
                  (${rental.status} == '예약' ? 'rental-period' :
                  (${rental.status} == '취소' ? 'status-cancle' :
                  (${rental.status} == '반납완료' ? 'status-done' : '')))"></span>
            </div>
          <div class="rental-period">
            <span th:text="'대여기간: ' + ${#dates.format(rental.startDate, 'yyyy.MM.dd')} + ' ~ ' + ${#dates.format(rental.endDate, 'yyyy.MM.dd')}" style="color: #3c1e1e"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
