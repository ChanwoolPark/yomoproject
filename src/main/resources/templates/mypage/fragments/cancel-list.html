<div class="my-cancel-list">
    <h3>내 신고 내역</h3>
    <table>
        <thead>
        <tr>
            <th>신고번호</th>
            <th>제목</th>
            <th>신고대상</th>
            <th>신고일</th>
            <th>처리상태</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="report : ${myReports}">
            <td th:text="${report.reportId}"></td>
            <td th:text="${report.title}"></td>
            <td th:text="${report.reportedId}"></td> <!-- reportedId 대신 닉네임 등으로 바꾸려면 추가 쿼리 필요 -->
            <td th:text="${#dates.format(report.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${report.status}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(myReports)}">
            <td colspan="5">신고 내역이 없습니다.</td>
        </tr>
        </tbody>
    </table>
</div>
