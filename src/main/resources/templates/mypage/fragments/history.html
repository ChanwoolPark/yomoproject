<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>출금 내역</title>
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
    <style>
        .yomopay-card {
            background: #fff;
            border-radius: 2rem;
            box-shadow: var(--card-shadow);
            border: 1.2px solid var(--card-border);
            padding: 36px 38px 30px 38px;
            margin-bottom: 32px;
        }

        .withdrawal-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 18px;
            font-size: 0.98em;
        }

        .withdrawal-table th {
            text-align: left;
            background: #f9f9fb;
            color: #333;
            padding: 11px 12px;
            border-bottom: 1.2px solid #e0e6ee;
        }

        .withdrawal-table td {
            padding: 11px 12px;
            border-bottom: 1px solid #f0f0f5;
            color: #222;
        }

        .withdrawal-table tr:last-child td {
            border-bottom: none;
        }

        .yomopay-card h3 {
            font-size: 1.34em;
            font-weight: 800;
            color: #222;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div class="yomopay-card">
    <h3>💸 내 출금 내역</h3>

    <table class="withdrawal-table">
        <thead>
        <tr>
            <th>신청일시</th>
            <th>금액</th>
            <th>은행명</th>
            <th>계좌번호</th>
            <th>상태</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="req : ${requests}">
            <td th:text="${#temporals.format(req.requestedAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${req.amount + ' P'}"></td>
            <td th:text="${req.bankName}"></td>
            <td th:text="${req.bankAccount}"></td>
            <td th:text="${req.status}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(requests)}">
            <td colspan="5" style="text-align:center; padding: 16px; color:#888;">출금 내역이 없습니다.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
