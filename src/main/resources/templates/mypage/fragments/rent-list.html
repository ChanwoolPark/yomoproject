<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>대여/예약중 목록</title>
    <style>
        .list-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 20px;
            margin-top: 10px;
            color: #3849c7;
        }
        .card-box {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            background: #fafbfc;
            box-shadow: 0 2px 8px 0 rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
        }
        .card-link {
            color: #3849c7;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.07rem;
            margin-bottom: 2px;
            cursor: pointer;
        }
        .card-link:hover {
            text-decoration: underline;
            color: #2c3ab2;
        }
        .status {
            color: #888;
            margin-top: 6px;
            font-size: 14px;
        }
        .empty-msg {
            color: #bbb;
            font-size: 1.09rem;
            padding: 24px 0;
            text-align: center;
            border-radius: 8px;
            background: #f6f7fa;
            border: 1.5px dashed #e5e5e5;
        }
    </style>
</head>
<body>

<!-- 제목 -->
<h2 class="list-title">대여 / 예약 내역</h2>

<!-- 내역 없을 때 -->
<div th:if="${#lists.isEmpty(myRentalList)}" class="empty-msg">
    대여/예약 내역이 없습니다.
</div>

<!-- 내역 있을 때 -->
<div th:each="rental : ${myRentalList}">
    <div class="card-box">
        <!-- 상품명 링크 -->
        <a th:href="@{/product/{id}(id=${rental.product.productId})}" class="card-link"
           th:text="${rental.product.title}">상품명</a>

        <!-- 상태 -->
        <span class="status" th:text="'상태: ' + ${rental.status}"></span>

        <!-- 반납완료 시 리뷰 -->
        <div style="margin-top: 10px;" th:if="${rental.status == '반납완료'}">
            <button type="button"
                    th:if="!${reviewWrittenMap[rental.rentalId]}"
                    th:attr="data-rental-id=${rental.rentalId}, data-product-id=${rental.product.productId}, data-target-id=${rental.product.seller.id}, data-product-title=${rental.product.title}"
                    onclick="openReviewModalByAttr(this)"
                    style="padding:6px 16px; border-radius:7px; border:none; background:#596bff; color:#fff; font-weight:500; cursor:pointer;">
                리뷰쓰기
            </button>
            <span th:if="${reviewWrittenMap[rental.rentalId]}"
                  style="color:#aaa; font-weight:600; font-size:0.97rem;">작성완료</span>
        </div>
    </div>
</div>

</body>
</html>
