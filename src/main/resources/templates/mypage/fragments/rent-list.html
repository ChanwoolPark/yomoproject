<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>대여/예약 내역</title>
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
    <style>
        .rental-history-card {
            background: #fff;
            border-radius: 2rem;
            box-shadow: var(--card-shadow);
            border: 1.2px solid var(--card-border);
            padding: 36px 38px 30px 38px;
            margin-bottom: 32px;
        }

        .rental-history-card h3 {
            font-size: 1.34em;
            font-weight: 800;
            color: #222;
            margin-bottom: 20px;
        }

        .rental-item {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 13px 0;
            border-bottom: 1px dashed #eee;
        }

        .rental-item:last-child {
            border-bottom: none;
        }

        .rental-thumb {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 2px 5px #a3c9ff1a;
            border: 1px solid #f0f0f0;
        }

        .rental-info {
            flex: 1;
        }

        .rental-title {
            font-weight: 700;
            font-size: 1.02rem;
            color: #222;
            display: block;
            margin-bottom: 4px;
        }

        .rental-status {
            font-size: 0.95rem;
            color: #666;
        }

        .review-btn {
            padding: 6px 16px;
            border-radius: 7px;
            border: none;
            background: var(--active);
            color: #fff;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.94rem;
            margin-top: 8px;
        }

        .review-done {
            color: #aaa;
            font-weight: 600;
            font-size: 0.97rem;
            margin-top: 8px;
            display: inline-block;
        }

        .empty-msg {
            padding: 24px;
            text-align: center;
            background: #fafbfd;
            border-radius: 1.4rem;
            border: 1px solid #f0eefb;
            box-shadow: 0 1px 6px #a3c9ff12;
            font-size: 0.98rem;
            color: #999;
        }
    </style>
</head>
<body>

<div class="rental-history-card">
    <h3>📦 대여 / 예약 내역</h3>

    <!-- 내역 없을 때 -->
    <div th:if="${#lists.isEmpty(myRentalList)}" class="empty-msg">
        대여/예약 내역이 없습니다.
    </div>

    <!-- 내역 있을 때 -->
    <div th:each="rental : ${myRentalList}" class="rental-item">
        <img th:src="${rental.product.thumbnailUrl} != null ? ${rental.product.thumbnailUrl} : '/images/no-image.png'"
             class="rental-thumb"
             alt="상품 이미지"
             onerror="this.onerror=null;this.src='/images/no-image.png';">

        <div class="rental-info">
            <a th:href="@{/product/{id}(id=${rental.product.productId})}"
               class="rental-title"
               th:text="${rental.product.title}">상품명</a>
            <div class="rental-status" th:text="'상태: ' + ${rental.status}"></div>

            <!-- 리뷰 버튼 -->
            <div th:if="${rental.status == '반납완료'}">
                <button type="button"
                        th:if="!${reviewWrittenMap[rental.rentalId]}"
                        th:attr="data-rental-id=${rental.rentalId}, data-product-id=${rental.product.productId}, data-target-id=${rental.product.seller.id}, data-product-title=${rental.product.title}"
                        onclick="openReviewModalByAttr(this)"
                        class="review-btn">
                    리뷰쓰기
                </button>
                <span th:if="${reviewWrittenMap[rental.rentalId]}" class="review-done">작성완료</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
