<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>요모페이 관리/충전</title>
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
    <link rel="stylesheet" href="/css/header.css">
    <style>
        .yomopay-card {
            background: #fff;
            border-radius: 2rem;
            box-shadow: var(--card-shadow);
            border: 1.2px solid var(--card-border);
            padding: 36px 38px 30px 38px;
            margin-bottom: 32px;
            font-family: "Pretendard", sans-serif;
        }

        .yomopay-card h2 {
            font-size: 1.34em;
            font-weight: 800;
            color: #222;
            margin-bottom: 20px;
        }

        .user-point {
            font-weight: 600;
            margin-bottom: 16px;
            color: #222;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1.2px solid var(--card-border);
            background: #fafafd;
            margin-bottom: 14px;
        }

        button[type="submit"],
        .withdraw-btn {
            width: 100%;
            padding: 12px 0;
            font-size: 1.05em;
            font-weight: 700;
            border-radius: 11px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px #465bff16;
            cursor: pointer;
        }

        button[type="submit"] {
            background: var(--active);
            color: #fff;
            border: none;
        }

        button[type="submit"]:hover {
            background: #263ed4;
        }

        .withdraw-btn {
            background: #222;
            color: white;
            border: none;
        }

        .withdraw-btn:hover {
            background: #444;
        }

        .charge-history {
            margin-top: 20px;
        }

        .charge-history h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .charge-history table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }

        .charge-history th,
        .charge-history td {
            padding: 12px;
            border: 1px solid #eee;
            text-align: center;
        }

        .charge-history th {
            background: #f5f5f8;
            font-weight: 700;
        }

        .charge-history td {
            background: #fff;
        }

        .alert {
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .alert.success {
            background: #f0fff2;
            color: #2ca54d;
        }

        .alert.error {
            background: #fff6f6;
            color: #eb2d2d;
        }
    </style>

</head>
<body>
<div class="yomopay-card">
    <h2>💰요모페이 관리/충전</h2>

    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <div class="user-point">
        내 포인트: <span th:text="${point}">12,000</span> P
    </div>

    <form action="/widget" method="post">
        <label for="chargeAmount">충전 금액</label>
        <input type="number" id="chargeAmount" name="chargeAmount" placeholder="충전할 금액 입력" min="1000" step="1000" required>
        <button type="submit">충전하기</button>
    </form>

    <a href="http://localhost:8080/withdrawal/request" style="text-decoration:none;">
        <button type="button" class="withdraw-btn">
            출금하기
        </button>
    </a>

    <div class="charge-history">
        <h3>최근 충전 내역</h3>
        <table>
            <thead>
            <tr>
                <th>날짜</th>
                <th>금액</th>
                <th>결제수단</th>
                <th>상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="log : ${logs}">
                <td th:text="${#dates.format(log.createdAt, 'yyyy-MM-dd')}"></td>
                <td th:text="${log.amount}"></td>
                <td th:text="${log.type}"></td>
                <td>완료</td>
            </tr>
            <tr th:if="${#lists.isEmpty(logs)}">
                <td colspan="4">충전 내역이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
