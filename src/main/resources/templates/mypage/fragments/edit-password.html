<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
    <style>
        body {
            background: #f9f9f9;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .pw-change-container {
            max-width: 480px;
            margin: 40px auto;
            padding: 32px 36px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 2px 16px 0 rgba(0,0,0,0.07);
            border: 1px solid #ddd;
        }
        .pw-change-container h2 {
            font-size: 2rem;
            margin-bottom: 22px;
            font-weight: 700;
            color: #353c47;
        }
        .form-row {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 1rem;
            color: #5c5c5c;
            font-weight: 500;
            margin-bottom: 7px;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            background: #fafbfc;
            font-size: 1rem;
            margin-bottom: 2px;
        }
        .input-msg {
            font-size: 0.95rem;
            color: #d22;
            min-height: 21px;
            margin-top: 2px;
            margin-left: 2px;
        }
        .input-msg.ok {
            color: #16c07f;
        }
        .btn-wrap {
            width: 100%;
            margin-top: 18px;
            text-align: center;
        }
        button[type="submit"] {
            width: 100%;
            padding: 10px 0;
            background: #596bff;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.07rem;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(89,107,255,0.09);
        }
        button[type="submit"]:hover {
            background: #3849c7;
        }
    </style>
</head>
<body>
<div class="pw-change-container">
    <h2>비밀번호 변경</h2>
    <form id="password-change-form" method="post" action="#" autocomplete="off">
        <div class="form-row">
            <label>현재 비밀번호</label>
            <input type="password" name="currentPw" required>
            <div id="currentPw-msg" class="input-msg"></div>
        </div>
        <div class="form-row">
            <label>새 비밀번호</label>
            <input type="password" name="newPw" id="newPw" required>
            <div id="newPw-rule-msg" class="input-msg"></div>
        </div>
        <div class="form-row">
            <label>새 비밀번호 확인</label>
            <input type="password" name="confirmPw" id="confirmPw" required>
            <div id="newPw-msg" class="input-msg"></div>
        </div>
        <div class="btn-wrap">
            <button type="submit">변경하기</button>
        </div>
        <div id="pw-msg" class="input-msg"></div>
    </form>
</div>
<script>
    function validatePassword(pw) {
        const reg = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()_+{}\[\]:;<>,.?~\\/-]).{8,20}$/;
        return reg.test(pw);
    }

    document.getElementById('password-change-form').onsubmit = function(e) {
        e.preventDefault();

        let newPw = document.getElementById('newPw').value;
        let confirmPw = document.getElementById('confirmPw').value;

        // 유효성 검사
        if (!validatePassword(newPw)) {
            document.getElementById('newPw-rule-msg').textContent =
                '8~20자, 영문/숫자/특수문자를 각각 1개 이상 포함해야 합니다.';
            document.getElementById('newPw-msg').textContent = '';
            document.getElementById('currentPw-msg').textContent = '';
            document.getElementById('pw-msg').textContent = '';
            return false;
        } else {
            document.getElementById('newPw-rule-msg').textContent = '';
        }

        if (newPw !== confirmPw) {
            document.getElementById('newPw-msg').textContent = '새 비밀번호가 일치하지 않습니다.';
            document.getElementById('currentPw-msg').textContent = '';
            document.getElementById('pw-msg').textContent = '';
            return false;
        } else {
            document.getElementById('newPw-msg').textContent = '';
        }

        let formData = new FormData(this);
        fetch('/mypage/password-change', {
            method: 'POST',
            body: formData,
            headers: {'X-Requested-With': 'XMLHttpRequest'}
        })
            .then(res => res.json())
            .then(data => {
                // 메시지 전부 클리어!
                document.getElementById('pw-msg').textContent = '';
                document.getElementById('currentPw-msg').textContent = '';
                document.getElementById('newPw-rule-msg').textContent = '';
                document.getElementById('newPw-msg').textContent = '';

                if (data.success) {
                    loadContent('edit-info');
                } else {
                    if (data.message.includes("현재 비밀번호")) {
                        document.getElementById('currentPw-msg').textContent = data.message;
                    } else if (data.message.includes("이전 비밀번호")) {
                        document.getElementById('newPw-rule-msg').textContent = data.message;
                    } else {
                        document.getElementById('pw-msg').textContent = data.message;
                    }
                }
            });
        return false;
    };

    document.getElementsByName('currentPw')[0].addEventListener('input', function() {
        document.getElementById('currentPw-msg').textContent = '';
    });
    document.getElementById('newPw').addEventListener('input', function() {
        document.getElementById('newPw-rule-msg').textContent = '';
    });
    document.getElementById('confirmPw').addEventListener('input', function() {
        document.getElementById('newPw-msg').textContent = '';
    });

    // 실시간 입력 시 규칙 검사(선택)
    document.getElementById('newPw').addEventListener('input', function() {
        if (!validatePassword(this.value)) {
            document.getElementById('newPw-rule-msg').textContent =
                '8~20자, 영문/숫자/특수문자를 각각 1개 이상 포함해야 합니다.';
        } else {
            document.getElementById('newPw-rule-msg').textContent = '';
        }
    });

</script>
</body>
</html>
