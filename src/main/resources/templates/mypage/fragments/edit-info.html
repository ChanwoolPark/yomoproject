<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>개인정보 수정</title>
    <style>
        body {
            background: #f9f9f9;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .edit-profile-container {
            max-width: 480px;
            margin: 40px auto;
            padding: 32px 36px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 2px 16px 0 rgba(0,0,0,0.07);
            border: 1px solid #ddd;
        }
        .edit-profile-container h2 {
            font-size: 2rem;
            margin-bottom: 22px;
            font-weight: 700;
            color: #353c47;
        }
        .profile-img-wrap {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }
        .profile-img-wrap img {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 50%;
            border: 1.5px solid #eaeaea;
            background: #eee;
        }
        .form-row {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 1rem;
            color: #5c5c5c;
            font-weight: 500;
            margin-bottom: 7px;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            background: #fafbfc;
            font-size: 1rem;
            margin-bottom: 2px;
        }
        input[readonly] {
            background: #f2f2f2;
            color: #aaa;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }
        button {
            padding: 8px 18px;
            background: #596bff;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 1rem;
        }
        button:hover {
            background: #3849c7;
        }
        .input-msg {
            font-size: 0.95rem;
            color: #d22;
            min-height: 21px;
            margin-top: 2px;
            margin-left: 2px;
        }
        .input-msg.ok {
            color: #16c07f;
        }
        .address-row {
            display: flex;
            gap: 8px;
        }
        .address-row input {
            flex: none;
        }
        .address-row button {
            padding: 8px 12px;
            margin-left: 0;
            font-size: 0.95rem;
        }
        .save-btn {
            width: 100%;
            margin-top: 22px;
            font-size: 1.07rem;
        }
    </style>
    <script src="https://ssl.daumcdn.net/dmaps/map_js_init/postcode.v2.js"></script>
</head>
<body>
<div class="edit-profile-container">
    <form id="edit-info-form" th:action="@{/mypage/edit-info}" method="post" enctype="multipart/form-data" autocomplete="off">
        <h2>개인정보 수정</h2>

        <!-- 프로필 이미지 + 파일 업로드 -->
        <div class="profile-img-wrap">
            <img th:src="${user.profileImageUrl} != null ? ${user.profileImageUrl} : '/images/default-profile.png'"
                 alt="프로필 이미지"
                 onerror="this.onerror=null;this.src='/images/default-profile.png';">
            <input type="file" name="profileImageFile" accept="image/*">
        </div>

        <!-- 닉네임 + 중복확인 -->
        <div class="form-row">
            <label for="nickname">닉네임</label>
            <div class="btn-row">
                <input type="text" id="nickname" name="nickname" th:value="${user.nickname}" data-original-nickname="${user.nickname}" autocomplete="off">
                <button type="button" onclick="checkNickname()">중복 확인</button>
            </div>
            <div id="nickname-check-msg" class="input-msg"></div>
        </div>

        <!-- 이메일 + 중복확인 -->
        <div class="form-row">
            <label for="email">이메일</label>
            <div class="btn-row">
                <input type="email" id="email" name="email" th:value="${user.email}" data-original-email="${user.eamil}" autocomplete="off">
                <button type="button" onclick="checkEmail()">중복 확인</button>
            </div>
            <div id="email-check-msg" class="input-msg"></div>
        </div>

        <!-- 휴대폰번호(실시간 중복확인) -->
        <div class="form-row">
            <label for="phone">휴대폰 번호</label>
            <input type="text" id="phone" name="phone" th:value="${user.phone}" data-original-phone="${user.phone}" maxlength="13" autocomplete="off">
            <div id="phone-check-msg" class="input-msg"></div>
        </div>


        <!-- 아이디 (readonly) -->
        <div class="form-row">
            <label>아이디</label>
            <input type="text" th:value="${user.username}" readonly>
        </div>

        <!-- 이름 -->
        <div class="form-row">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" th:value="${user.name}" readonly>
        </div>

        <!-- 비밀번호 변경 -->
        <div class="form-row">
            <label>비밀번호</label>
            <button type="button" onclick="loadContent('password-change')">비밀번호 변경</button>
        </div>

        <!-- 주소 + 카카오 우편번호 팝업 -->
        <div class="form-row address-row">
            <label for="zipNo">우편번호</label>
            <input type="text" id="zipNo" name="zipNo" th:value="${user.zipNo}" style="width:100px;" readonly>
            <button type="button" onclick="execDaumPostcode()">주소검색</button>
        </div>
        <div class="form-row">
            <label for="address">주소</label>
            <input type="text" id="address" name="address" th:value="${user.address}" readonly>
        </div>
        <div class="form-row">
            <label for="addressDetail">상세주소</label>
            <input type="text" id="addressDetail" name="addressDetail" th:value="${user.addressDetail}">
        </div>

        <button class="save-btn" type="submit">저장</button>

        <!-- 💣 탈퇴 버튼! -->
        <button type="button" style="margin-top:18px; background:#d22; color:white; width:100%;" onclick="withdrawUser()">
            회원 탈퇴
        </button>
    </form>
</div>
</body>
</html>
