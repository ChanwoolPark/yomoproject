<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <meta charset="UTF-8">
    <style>
        /* 리뷰 모달 카드 */
        .review-modal-card {
            background: #fff;
            border-radius: 1.8rem;
            box-shadow: 0 8px 32px #2222a325, 0 1px 4px #465bff11;
            min-width: 360px;
            max-width: 96vw;
            width: 410px;
            padding: 38px 36px 30px 36px;
            position: relative;
            animation: modalPop 0.23s cubic-bezier(.8,-0.13,.39,1.18);
        }

        @keyframes modalPop {
            from { transform: translateY(60px) scale(0.95); opacity:0;}
            to   { transform: none; opacity:1;}
        }

        /* 상단 X 버튼 */
        .modal-close-btn {
            position: absolute;
            right: 21px; top: 17px;
            font-size: 1.45em;
            color: #aaa;
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 10px;
            transition: color 0.17s;
        }
        .modal-close-btn:hover { color: #465bff; }

        /* 타이틀 & 상품명 */
        .review-modal-card h2 {
            font-size: 1.18em;
            font-weight: 800;
            margin-bottom: 15px;
            color: #222;
            text-align: left;
        }
        .modal-product-title {
            margin-bottom: 9px;
            color: #3849c7;
            font-weight: 700;
            font-size: 1.01em;
        }

        .modal-star-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 17px;
            font-size: 1.1em;
        }
        #reviewStars .star {
            font-size: 1.21em;
            cursor: pointer;
            color: #adb6de;
            transition: color 0.17s;
            margin-right: 3px;
            user-select: none;
        }
        #reviewStars .star.selected,
        #reviewStars .star:hover { color: #ffd600; }

        /* 폼 스타일 */
        #reviewForm textarea {
            width: 100%;
            border-radius: 9px;
            border: 1.2px solid #eee;
            font-size: 1em;
            min-height: 92px;
            padding: 13px;
            resize: none;
            margin-bottom: 19px;
            background: #fafafd;
            transition: border 0.15s;
        }
        #reviewForm textarea:focus {
            border: 1.2px solid #A3C9FF;
            background: #f0f7ff;
        }

        /* 버튼 row */
        .modal-btn-row {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-submit-btn {
            background: #465BFF;
            color: #fff;
            border: none;
            border-radius: 9px;
            padding: 9px 23px;
            font-size: 1em;
            font-weight: 700;
            box-shadow: 0 2px 8px #465bff15;
            cursor: pointer;
            transition: background 0.14s;
        }
        .modal-submit-btn:hover { background: #263ed4; }

        .modal-cancel-btn {
            background: #e3e7fa;
            color: #465BFF;
            border: none;
            border-radius: 9px;
            padding: 9px 20px;
            font-size: 1em;
            font-weight: 700;
            box-shadow: 0 2px 6px #465bff0c;
            cursor: pointer;
            transition: background 0.13s, color 0.13s;
        }
        .modal-cancel-btn:hover { background: #eef0fa; color: #222; }

    </style>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/mypage.css">
    <!-- Lucide 아이콘 CDN (outline 스타일) -->

<!-- 모달 (숨김 기본) -->
<div id="reviewModal" style="display:none; position:fixed; left:0; top:0; width:100vw; height:100vh; background:rgba(0,0,0,0.38); z-index:9999; justify-content:center; align-items:center;">

<script>

    // Lucide 아이콘 적용
    window.addEventListener("DOMContentLoaded", () => {
        lucide.createIcons();
        setActiveByMenu();
    });

    function setActive(element) {
        document.querySelectorAll('#sidebar li.sub').forEach(li => li.classList.remove('active'));
        element.classList.add('active');
        lucide.createIcons();
    }

    function setActiveByMenu() {
        const urlParams = new URLSearchParams(window.location.search);
        const menu = urlParams.get("menu") || "profile";
        let matched = false;
        document.querySelectorAll('#sidebar li.sub').forEach(li => {
            if (li.onclick && li.onclick.toString().includes(menu)) {
                li.classList.add('active');
                matched = true;
            } else {
                li.classList.remove('active');
            }
        });
        if (!matched) document.querySelectorAll('#sidebar li.sub')[0].classList.add('active');

        if (menu && menu !== "home-summary") {
            document.querySelectorAll('#sidebar li.sub').forEach(li => {
                if (li.onclick && li.onclick.toString().includes(menu)) {
                    li.classList.add('active');
                    matched = true;
                } else {
                    li.classList.remove('active');
                }
            });
        } else {
            document.querySelectorAll('#sidebar li.sub').forEach(li => li.classList.remove('active'));
        }
    }

    // ⭐⭐ loadContent 함수가 사라지면 동적 로딩이 아예 안 됨!
    function loadContent(menuName) {
        history.pushState({ menu: menuName }, '', `/mypage?menu=${menuName}`);
        fetch(`/mypage/${menuName}`)
            .then(response => response.text())
            .then(html => {
                const contentDiv = document.getElementById('content');
                contentDiv.innerHTML = html;

                // 새로 삽입된 script 실행!
                contentDiv.querySelectorAll("script").forEach(oldScript => {
                    const newScript = document.createElement("script");
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    document.body.appendChild(newScript);
                    document.body.removeChild(newScript);
                });
            });
    }

    // 뒤로가기 동작도 복구!
    window.onpopstate = function (event) {
        const menu = event.state?.menu || 'profile';
        fetch(`/mypage/${menu}`)
            .then(response => response.text())
            .then(html => {
                document.getElementById('content').innerHTML = html;
            });
    };
</script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // ✨ URL 파라미터에서 menu 추출
        const urlParams = new URLSearchParams(window.location.search);
        const menu = urlParams.get("menu") || "home-summary"; // 기본은 home-summary
        loadContent(menu);
    });

    function loadContent(menuName) {
        // 히스토리 push는 menu 파라미터 방식으로!
        history.pushState({ menu: menuName }, '', `/mypage?menu=${menuName}`);

        fetch(`/mypage/${menuName}`)
    .then(response => response.text())
            .then(html => {
                const contentDiv = document.getElementById('content');
                contentDiv.innerHTML = html;

                // ★★★ 새로 삽입된 script 태그 직접 실행!
                contentDiv.querySelectorAll("script").forEach(oldScript => {
                    const newScript = document.createElement("script");
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    // script 태그는 body에 붙여야 즉시 실행됨!
                    document.body.appendChild(newScript);
                    document.body.removeChild(newScript); // 메모리 누수 방지
                });
            });


    }



    // ✅ 뒤로가기 동작
    window.onpopstate = function(event) {
        const menu = event.state?.menu || 'home-summary';
        fetch(`/mypage/${menu}`)
    .then(response => response.text())
            .then(html => {
                document.getElementById('content').innerHTML = html;
            });
    };


    let nicknameValid = true; // 본인 정보 그대로면 true!
    let emailValid = true;
    let phoneValid = true;

    window.checkNickname = function() {
        const nicknameInput = document.getElementById('nickname');
        const nickname = nicknameInput.value.trim();
        const original = nicknameInput.getAttribute('data-original-nickname');
        const msg = document.getElementById('nickname-check-msg');

        // 본인 닉네임 그대로면 PASS
        if (nickname === original) {
            msg.textContent = "현재 사용중인 닉네임입니다.";
            msg.className = "input-msg ok";
            nicknameValid = true;
            return;
        }

        // 이하는 기존과 동일
        fetch('/mypage/check-nickname?nickname=' + encodeURIComponent(nickname))
            .then(response => response.json())
            .then(isDuplicate => {
                if (isDuplicate) {
                    msg.textContent = "이미 사용중인 닉네임입니다!";
                    msg.className = "input-msg";
                    nicknameValid = false;
                } else {
                    msg.textContent = "사용 가능한 닉네임입니다!";
                    msg.className = "input-msg ok";
                    nicknameValid = true;
                }
            }).catch(() => {
            msg.textContent = "서버 오류!";
            msg.className = "input-msg";
            nicknameValid = false;
        });
    }

    window.checkEmail = function() {
        const emailInput = document.getElementById('email');
        const email = emailInput.value.trim();
        const original = emailInput.getAttribute('data-original-email');
        const msg = document.getElementById('email-check-msg');

        if (email === original) {
            msg.textContent = "현재 사용중인 이메일입니다.";
            msg.className = "input-msg ok";
            emailValid = true;
            return;
        }

        fetch('/mypage/check-email?email=' + encodeURIComponent(email))
            .then(response => response.json())
            .then(isDuplicate => {
                if (isDuplicate) {
                    msg.textContent = "이미 등록된 이메일입니다!";
                    msg.className = "input-msg";
                    emailValid = false;
                } else {
                    msg.textContent = "사용 가능한 이메일입니다!";
                    msg.className = "input-msg ok";
                    emailValid = true;
                }
            }).catch(() => {
            msg.textContent = "서버 오류!";
            msg.className = "input-msg";
            emailValid = false;
        });
    }

    function bindEditInfoEvents() {
        // 휴대폰 실시간 중복
        const phoneInput = document.getElementById('phone');
        if(phoneInput) {
            phoneInput.addEventListener('input', function () {
                const phone = this.value.trim();
                const original = phoneInput.getAttribute('data-original-phone');
                const msg = document.getElementById('phone-check-msg');

                // 본인 폰 그대로면 PASS
                if(phone === original) {
                    msg.textContent = "현재 사용중인 번호입니다.";
                    msg.className = "input-msg ok";
                    phoneValid = true;
                    return;
                }

                phoneValid = false;
                msg.textContent = "";
                if (!phone) return;
                fetch('/mypage/check-phone?phone=' + encodeURIComponent(콜))
                    .then(response => response.json())
                    .then(isDuplicate => {
                        if (isDuplicate) {
                            msg.textContent = "이미 등록된 휴대폰 번호입니다!";
                            msg.className = "input-msg";
                            phoneValid = false;
                        } else {
                            msg.textContent = "사용 가능한 번호입니다!";
                            msg.className = "input-msg ok";
                            phoneValid = true;
                        }
                    }).catch(() => {
                    msg.textContent = "서버 오류!";
                    msg.className = "input-msg";
                    phoneValid = false;
                });
            });
        }

        // 폼 제출 시
        const form = document.getElementById('edit-info-form');
        if(form) {
            form.onsubmit = function(e) {
                if (!nicknameValid) {
                    alert("닉네임 중복확인을 해주세요!");
                    document.getElementById('nickname').focus();
                    e.preventDefault();
                    return false;
                }
                if (!emailValid) {
                    alert("이메일 중복확인을 해주세요!");
                    document.getElementById('email').focus();
                    e.preventDefault();
                    return false;
                }
                if (!phoneValid) {

                }
            }
        }

    // ---- 카카오 주소 검색 ----
    function execDaumPostcode() {
        if (typeof daum === "undefined") {
            alert("카카오 우편번호 라이브러리가 아직 로드되지 않았어요. 잠시 후 다시 시도해주세요!");
            return;
        }
        new daum.Postcode({
            oncomplete: function(data) {
                document.getElementById('zipNo').value = data.zonecode;
                document.getElementById('address').value = data.roadAddress || data.jibunAddress;
                document.getElementById('addressDetail').focus();
            }
        }).open();
    }

    function openReviewModalByAttr(btn) {
        const rentalId = btn.getAttribute('data-rental-id');
        const productId = btn.getAttribute('data-product-id');
        const targetId = btn.getAttribute('data-target-id');
        const productTitle = btn.getAttribute('data-product-title');
        document.getElementById('modalRentalId').value = rentalId;
        document.getElementById('modalProductId').value = productId;
        document.getElementById('modalTargetId').value = targetId;
        document.getElementById('modalProductTitle').innerText = "상품명: " + productTitle;
        document.getElementById('reviewModal').style.display = 'flex';
    }


    // 모달 닫기
    function closeReviewModal() {
        document.getElementById('reviewModal').style.display = 'none';
        document.getElementById('reviewContent').value = '';
    }

    // 폼 제출 이벤트 (ajax로 할 거면 여기서 처리)
    document.getElementById('reviewForm').onsubmit = function(e) {
        e.preventDefault();
        // 여기서 ajax로 리뷰 등록 처리하면 됨!
        // rentalId: document.getElementById('modalRentalId').value
        // content: document.getElementById('reviewContent').value
        alert('리뷰 등록 기능은 곧 추가됩니다! (이제 서버 연동하면 돼)');
        closeReviewModal();
    };

    // 평점 입력 기능
    document.querySelectorAll('#reviewStars .star').forEach(star => {
        star.addEventListener('click', function() {
            let rating = this.getAttribute('data-value');
            document.getElementById('modalRating').value = rating;
            document.querySelectorAll('#reviewStars .star').forEach((s, idx) => {
                s.classList.toggle('selected', idx < rating);
                s.innerHTML = idx < rating ? '★' : '☆';
            });
        });
    });

    document.getElementById('reviewForm').onsubmit = function(e) {
        e.preventDefault();
        let rentalId = document.getElementById('modalRentalId').value;
        let content = document.getElementById('reviewContent').value.trim();
        let rating = document.getElementById('modalRating').value;

        if (!content || !rating) {
            alert('리뷰 내용과 평점을 모두 입력하세요!');
            return;
        }

        fetch('/reviews/write', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                rentalId: rentalId,
                productId: document.getElementById('modalProductId').value,
                targetId: document.getElementById('modalTargetId').value,
                reviewText: content,
                rating: rating
            })
        })
            .then(res => res.json())
            .then(result => {
                if(result.success) {
                    alert('리뷰가 등록되었습니다!');
                    closeReviewModal();
                    // 평점 갱신 콜백 실행(알잘딱: 그냥 새로고침도 O, 아래 참고!)
                    location.reload();
                } else {
                    alert('리뷰 등록 실패: ' + result.message);
                }
            });
    };


    function toggleAnswer(idx) {
        const box = document.getElementById("answerBox" + idx);
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }


</script>

<script>
    function withdrawUser() {
        if (confirm('정말 탈퇴하시겠어요? 30일 이내 재로그인하면 복구 가능하고, 30일 이후 완전 삭제됩니다!')) {
            fetch('/mypage/withdraw', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert('탈퇴 처리되었습니다. 30일 이내 재로그인하면 복구됩니다!');
                        window.location.href = '/logout'; // 자동 로그아웃
                    } else {
                        alert(data.message || '오류가 발생했습니다.');
                    }
                });
        }
    }
</script>
