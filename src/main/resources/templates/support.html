<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>고객센터</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f9f9;
        }

        .support-wrapper {
            max-width: 800px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .support-wrapper h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
            color: #333;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .search-bar button {
            padding: 12px 20px;
            background-color: #7c4dff;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tabs button {
            background: none;
            border: none;
            font-weight: bold;
            font-size: 16px;
            color: #888;
            padding-bottom: 4px;
            cursor: pointer;
        }

        .tabs button.active {
            color: #7c4dff;
            border-bottom: 2px solid #7c4dff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .faq-item {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
            cursor: pointer;
        }

        .faq-item .question {
            font-weight: bold;
        }

        .faq-item .answer {
            margin-top: 6px;
            color: #666;
            display: none;
        }

        form.inquiry-form input,
        form.inquiry-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        form.inquiry-form button {
            background-color: #7c4dff;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .notice-list li {
            margin-bottom: 10px;
        }

        .notice-list li a {
            text-decoration: none;
            color: #333;
        }

        .notice-list li a:hover {
            color: #7c4dff;
        }
    </style>
</head>
<body>

<div class="support-wrapper">
    <h2>고객센터</h2>

    <!-- 검색창 -->
    <div class="search-bar">
        <input type="text" placeholder="궁금한 내용을 입력하세요" />
        <button type="button">검색</button>
    </div>

    <!-- 탭 -->
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('faq')">자주 묻는 질문</button>
        <button class="tab-btn" onclick="showTab('inquiry')">문의하기</button>
        <button class="tab-btn" onclick="showTab('notice')">공지사항</button>
    </div>

    <!-- 탭 내용: FAQ -->
    <div class="tab-content active" id="faq">
        <div class="faq-item" onclick="toggleAnswer(this)">
            <div class="question">Q. 비밀번호를 잊어버렸어요</div>
            <div class="answer">A. 로그인 화면에서 ‘비밀번호 찾기’를 눌러 재설정할 수 있습니다.</div>
        </div>
        <div class="faq-item" onclick="toggleAnswer(this)">
            <div class="question">Q. 요모포인트는 어떻게 적립하나요?</div>
            <div class="answer">A. 대여 완료 후 리뷰 작성 시 포인트가 지급됩니다.</div>
        </div>
        <!-- 더 추가 가능 -->
    </div>

    <!-- 탭 내용: 문의하기 -->
    <div class="tab-content" id="inquiry">
        <form class="inquiry-form" method="post" action="/support/new">
            <input type="text" name="title" placeholder="문의 제목을 입력해주세요" required> <!-- ★ 추가된 제목 필드 -->
            <input type="text" name="email" placeholder="이메일 주소를 입력해주세요" required>
            <textarea name="content" placeholder="문의 내용을 입력해주세요" rows="6" required></textarea>
            <button type="submit">문의 보내기</button>
        </form>
    </div>


    <!-- 탭 내용: 공지사항 -->
    <div class="tab-content" id="notice">
        <ul class="notice-list">
            <li><a href="/support/notice/1">[공지] 요모 오픈 안내</a></li>
            <li><a href="/support/notice/2">[안내] 6월 배송 지연 안내</a></li>
        </ul>
    </div>
</div>

<script>
    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        document.getElementById(id).classList.add('active');
        document.querySelector(`.tab-btn[onclick="showTab('${id}')"]`).classList.add('active');
    }

    function toggleAnswer(el) {
        const answer = el.querySelector('.answer');
        answer.style.display = answer.style.display === 'block' ? 'none' : 'block';
    }
</script>

</body>
</html>
