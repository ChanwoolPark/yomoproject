<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="https://static.toss.im/icons/png/4x/icon-toss-logo.png" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=500, initial-scale=1.0" />
  <title>요모조모 결제완료</title>
  <link rel="stylesheet" href="/css/header.css">
  <style>
    :root {
      --main-blue: #465BFF;
      --light-bg: #FAFAFC;
      --yellow: #FFED7B;
      --sub-blue: #A3C9FF;
      --soft-purple: #CEC8FE;
      --font: 'Segoe UI', 'GmarketSans', 'sans-serif';
    }
    html, body {
      background: var(--light-bg);
      color: #222;
      font-family: var(--font);
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100vh;
    }
    .pay-section {
      max-width: 420px;
      margin: 60px auto 40px auto;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 6px 24px rgba(70, 91, 255, 0.06);
      padding: 38px 38px 30px 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pay-section img {
      width: 76px;
      margin-bottom: 10px;
    }
    .pay-section h2 {
      font-size: 1.65rem;
      color: var(--main-blue);
      font-weight: 700;
      margin: 0 0 22px 0;
      letter-spacing: -1px;
    }
    .pay-info-box {
      width: 100%;
      background: var(--soft-purple);
      border-radius: 14px;
      padding: 18px 24px;
      margin-bottom: 24px;
      box-sizing: border-box;
    }
    .pay-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .pay-row:last-child { margin-bottom: 0; }
    .pay-row b {
      color: var(--main-blue);
      font-size: 1.03em;
      font-weight: 600;
    }
    .pay-key {
      word-break: break-all;
      font-size: 0.97em;
      color: #767676;
      width: 215px;
      text-align: right;
    }
    .pay-section .button-row {
      width: 100%;
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .button-main, .button-mypage {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 14px 0;
      font-size: 1.07rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s;
    }
    .button-main {
      background: var(--main-blue);
      color: #fff;
      box-shadow: 0 1px 5px rgba(70, 91, 255, 0.06);
    }
    .button-main:hover {
      background: #273FD3;
    }
    .button-mypage {
      background: var(--yellow);
      color: var(--main-blue);
      border: 2px solid var(--main-blue);
    }
    .button-mypage:hover {
      background: #fffbe5;
    }
    /* 반응형 약간 */
    @media (max-width: 520px) {
      .pay-section { padding: 18px 4vw 20px 4vw; }
      .pay-info-box { padding: 12px 2vw; }
      .pay-row b { font-size: 1em; }
    }
  </style>
</head>
<body>
<!-- 헤더 -->
<div th:replace="fragments/header :: header"></div>

<div class="pay-section">
  <img src="https://static.toss.im/illusts/check-blue-spot-ending-frame.png" alt="완료" />
  <h2>결제가 완료됐어요</h2>

  <div class="pay-info-box">
    <div class="pay-row">
      <b>결제금액</b>
      <span id="amount"></span>
    </div>
    <div class="pay-row">
      <b>주문번호</b>
      <span id="orderId"></span>
    </div>
    <div class="pay-row">
      <b>PaymentKey</b>
      <span class="pay-key" id="paymentKey"></span>
    </div>
  </div>

  <div class="button-row">
    <button class="button-main" onclick="location.href='/'">메인 화면</button>
    <button class="button-mypage" onclick="location.href='/mypage?menu=yomopay';">마이페이지</button>
  </div>
</div>

<script>
  // 쿼리 파라미터 값이 결제 요청할 때 보낸 데이터와 동일한지 반드시 확인하세요.
  // 클라이언트에서 결제 금액을 조작하는 행위를 방지할 수 있습니다.
  const urlParams = new URLSearchParams(window.location.search);

  // 서버로 결제 승인에 필요한 결제 정보를 보내세요.
  async function confirm() {
    var requestData = {
      paymentKey: urlParams.get("paymentKey"),
      orderId: urlParams.get("orderId"),
      amount: urlParams.get("amount"),
    };

    const response = await fetch("/confirm", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify(requestData),
    });

    const json = await response.json();

    if (!response.ok) {
      window.location.href = `/fail?message=${json.message}&code=${json.code}`;
    }

    return json;
  }

  // 결제 정보 표기
  document.getElementById("orderId").textContent = urlParams.get("orderId");
  document.getElementById("amount").textContent = urlParams.get("amount") + "원";
  document.getElementById("paymentKey").textContent = urlParams.get("paymentKey");
</script>
<!-- 푸터 -->
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
