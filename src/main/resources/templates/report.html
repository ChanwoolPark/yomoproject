<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신고하기</title>
  <style>
    body {
      font-family: sans-serif;
    }
    .report-container {
      width: 400px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"],
    textarea,
    select { /* select 태그 스타일 추가 */
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 3px;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    button {
      background-color: #5cb85c;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 16px;
      width: 100%; /* 버튼 너비 100%로 설정 */
    }
    button:hover {
      background-color: #4cae4c;
    }
    .completion-message {
      text-align: center;
      margin-top: 20px;
      font-size: 1.2em;
      color: green;
      font-weight: bold;
      display: none; /* 초기에는 숨김 */
    }
  </style>
</head>
<body>
<div class="report-container">
  <h2>신고하기</h2>
  <form id="reportForm" action="/submit-report" method="post">
    <div class="form-group">
      <label for="reportType">신고 유형:</label>
      <select id="reportType" name="reportType">
        <option value="user">사용자 신고</option>
        <option value="content">게시물 신고</option>
        <option value="other">기타</option>
      </select>
    </div>
    <div class="form-group">
      <label for="target">신고 대상:</label>
      <input type="text" id="target" name="target" placeholder="신고 대상 (사용자 ID, 게시물 ID 등)" required>
    </div>
    <div class="form-group">
      <label for="reason">신고 사유:</label>
      <textarea id="reason" name="reason" placeholder="신고 사유를 자세히 작성해주세요." required></textarea>
    </div>
    <button type="submit">신고 제출</button>
  </form>

  <div id="completionMessage" class="completion-message">
    신고가 완료되었습니다.
  </div>
</div>

<script>
  document.getElementById('reportForm').addEventListener('submit', function(event) {
    event.preventDefault(); // 폼의 기본 제출 동작을 막습니다.

    // 실제 서버로 데이터를 전송하려면 아래 fetch API를 사용합니다.
    // 현재는 단순히 메시지를 띄우는 것이 목적이므로 주석 처리합니다.
    /*
    const form = event.target;
    const formData = new FormData(form);

    fetch(form.action, {
      method: form.method,
      body: formData
    })
    .then(response => {
      if (response.ok) {
        // 서버에서 성공적으로 처리되었을 때 메시지를 표시
        document.getElementById('reportForm').style.display = 'none'; // 폼 숨기기
        document.getElementById('completionMessage').style.display = 'block'; // 메시지 표시
      } else {
        alert('신고 처리 중 오류가 발생했습니다.');
      }
    })
    .catch(error => {
      console.error('Error:', error);
      alert('네트워크 오류가 발생했습니다.');
    });
    */

    // 서버 통신 없이 바로 메시지를 띄우는 경우:
    document.getElementById('reportForm').style.display = 'none'; // 폼 숨기기
    document.getElementById('completionMessage').style.display = 'block'; // 메시지 표시

  });
</script>
</body>
</html>
