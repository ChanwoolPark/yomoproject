<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메인 페이지</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        header, footer { background: #fff; padding: 10px 20px; border-bottom: 1px solid #eee; }
        .logo { font-weight: bold; color: orange; font-size: 24px; cursor: pointer; }
        .nav { display: flex; gap: 20px; margin-left: 30px; }
        .nav a { text-decoration: none; color: black; font-weight: bold; }
        .login { margin-left: auto; }
        .banner { height: 300px; background: #5b9bd5; color: white; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        footer { border-top: 1px solid #eee; font-size: 14px; line-height: 1.6; display: flex; justify-content: space-between; }
        #topBtn { position: fixed; bottom: 20px; right: 20px; padding: 15px; border-radius: 50%; background-color: #5b9bd5; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<main>
    <section class="banner">배너</section>
</main>

<div th:replace="fragments/footer :: footer"></div>

<button id="topBtn" onclick="scrollToTop()">Top<br>버튼</button>

<script>
    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', function() {
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const myInfoBtn = document.getElementById("myInfoBtn");
        // 로그인 여부에 따라 버튼 표시 (임시용)
        const isLoggedIn = false; // 실제 로그인 여부 체크 로직으로 대체
        if (loginBtn) loginBtn.style.display = isLoggedIn ? "none" : "inline";
        if (logoutBtn) logoutBtn.style.display = isLoggedIn ? "inline" : "none";
        if (myInfoBtn) myInfoBtn.style.display = isLoggedIn ? "inline" : "none";
    });
</script>

</body>
</html>
