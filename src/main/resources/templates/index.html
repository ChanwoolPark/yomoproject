<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메인 페이지</title>

    <!-- Swiper CSS CDN 추가 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <link rel="stylesheet" href="/css/header.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .banner {
            height: 300px;
            background: #5b9bd5;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        #topBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px;
            border-radius: 50%;
            background-color: #5b9bd5;
            color: white;
            border: none;
            cursor: pointer;
        }

        /* ✅ Swiper 커스터마이징 */
        .swiper-button-next,
        .swiper-button-prev {
            color: #ccc !important;
        }

        .swiper-pagination-bullet {
            background: #ccc !important;
            opacity: 0.6;
        }

        .swiper-pagination-bullet-active {
            background: #999 !important;
        }
    </style>
</head>
<body>

<!-- 헤더 삽입 -->
<div th:replace="fragments/header :: header"></div>

<main>
    <section class="banner swiper mySwiper" style="width: 100%; height: 400px; margin: 0;">
        <div class="swiper-wrapper">
            <div class="swiper-slide" th:each="img : ${imageList}">
                <img th:src="@{/images/{file}(file=${img})}" alt="배너 이미지"
                     style="width: 100%; height: 400px; object-fit: cover;" />
            </div>
        </div>

        <!-- Swiper control elements -->
        <div class="swiper-pagination"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </section>
</main>

<!-- 푸터 삽입 -->
<div th:replace="fragments/footer :: footer"></div>

<!-- 상단 이동 버튼 -->
<button id="topBtn" onclick="scrollToTop()">Top<br>버튼</button>

<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
<script>
    const swiper = new Swiper(".mySwiper", {
        loop: true,
        autoplay: {
            delay: 3000,
            disableOnInteraction: false,
        },
        pagination: {
            el: ".swiper-pagination",
            clickable: true,
        },
        navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
        },
    });
</script>

</body>
</html>
