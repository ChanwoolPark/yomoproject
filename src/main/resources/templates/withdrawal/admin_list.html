<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>출금 요청 관리</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #FAFAFC;
            color: #000;
            margin: 0;
            padding: 0;
        }

        .admin-container {
            max-width: 1000px;
            margin: 50px auto;
            background: white;
            padding: 2rem;
            border-radius: 14px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: #465BFF;
            border-bottom: 2px solid #A3C9FF;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #eee;
            padding: 10px;
            text-align: center;
        }

        thead {
            background-color: #CEC8FE;
        }

        select, button {
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #465BFF;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="admin-container">
    <h2>출금 요청 관리 (관리자 전용)</h2>
    <table>
        <thead>
        <tr>
            <th>신청일시</th>
            <th>신청자</th>
            <th>금액</th>
            <th>은행명</th>
            <th>계좌번호</th>
            <th>상태</th>
            <th>처리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="req : ${requests}">
            <td th:text="${#temporals.format(req.requestedAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${req.user.nickname}"></td>
            <td th:text="${req.amount}"></td>
            <td th:text="${req.bankName}"></td>
            <td th:text="${req.bankAccount}"></td>
            <td th:text="${req.status}"></td>
            <td>
                <form th:action="@{/admin/updateStatus}" method="post" style="display:inline;">
                    <input type="hidden" name="requestId" th:value="${req.id}"/>
                    <select name="status">
                        <option th:selected="${req.status=='대기'}" value="대기">대기</option>
                        <option value="완료">승인</option>
                        <option value="거절">거절</option>
                    </select>
                    <button type="submit">변경</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
