<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>출금 요청 관리</title>
</head>
<body>
<h2>출금 요청 관리 (관리자 전용)</h2>
<table border="1">
    <thead>
    <tr>
        <th>신청일시</th>
        <th>신청자</th>
        <th>금액</th>
        <th>은행명</th>
        <th>계좌번호</th>
        <th>상태</th>
        <th>처리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="req : ${requests}">
        <td th:text="${#temporals.format(req.requestedAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${req.user.nickname}"></td>
        <td th:text="${req.amount}"></td>
        <td th:text="${req.bankName}"></td>
        <td th:text="${req.bankAccount}"></td>
        <td th:text="${req.status}"></td>
        <td>
            <form th:action="@{/withdrawal/admin/updateStatus}" method="post" style="display:inline;">
                <input type="hidden" name="requestId" th:value="${req.id}"/>
                <select name="status">
                    <option th:selected="${req.status=='대기'}" value="대기">대기</option>
                    <option value="완료">승인</option>
                    <option value="거절">거절</option>
                </select>
                <button type="submit">변경</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
