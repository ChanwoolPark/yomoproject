<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>포인트 출금 신청</title>
</head>
<body>
<h2>포인트 출금 신청</h2>
<form th:action="@{/withdrawal/request}" method="post">
    <label>출금 금액(포인트):</label>
    <input type="number" name="amount" min="1000" step="1000" required placeholder="최소 1,000원" /><br/><br/>

    <label>은행명:</label>
    <input type="text" name="bankName" required placeholder="예: 카카오뱅크" /><br/><br/>

    <label>입금받을 계좌번호:</label>
    <input type="text" name="bankAccount" required /><br/><br/>

    <p style="color:#d48419">출금 신청 후 1~3일 이내 관리자가 직접 입금 처리합니다.<br/>
        (출금 내역은 [마이페이지>출금내역]에서 확인하세요)</p>
    <button type="submit">출금 신청</button>
    <div class="fee-info" style="background:#f8fafd;padding:1rem;border-radius:10px;font-size:0.97rem;margin-bottom:1.5rem;">
        <b>등급별 출금 수수료 안내</b><br>
        <ul style="margin:0.5rem 0 0 1.2rem;padding:0;">
            <li><b>브론즈</b> : 출금액의 <span style="color:#c33;">10%</span></li>
            <li><b>실버</b> : 출금액의 <span style="color:#4b8;">5%</span></li>
            <li><b>골드</b> : 출금액의 <span style="color:#cc0;">4%</span></li>
            <li><b>플래티넘</b> : 출금액의 <span style="color:#09c;">3%</span></li>
            <li><b>다이아몬드</b> : 출금액의 <span style="color:#26b;">1%</span></li>
        </ul>
        <div style="margin-top:0.5rem; color:#777;">
            출금 시 등급에 따라 자동으로 수수료가 차감됩니다.<br>
            (수수료는 출금 금액에서 자동 공제됩니다)
        </div>
    </div>
</form>
</body>
</html>
