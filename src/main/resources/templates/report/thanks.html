<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>신고 완료</title>
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background: #f7f8fa; margin: 0; padding: 0; }
    .thanks-container { max-width: 480px; margin: 100px auto; background: #fff; border-radius: 16px; box-shadow: 0 2px 8px #0001; text-align: center; padding: 40px 20px;}
    h2 { color: #4477ee; margin-bottom: 16px; }
    p { color: #555; margin-bottom: 32px; }
    button { background: #4477ee; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
<div class="thanks-container">
  <h2>신고가 접수되었습니다</h2>
  <p>신고해 주셔서 감사합니다. 빠른 시일 내에 검토 후 처리하겠습니다.</p>
  <button onclick="window.close();">창 닫기</button>
</div>
</body>
</html>
