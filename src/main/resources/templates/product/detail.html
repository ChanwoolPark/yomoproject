<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${product.title}">상품 상세</title>
  <style>
    .container {
      display: flex;
      padding: 20px;
      gap: 40px;
    }
    .left, .right {
      flex: 1;
    }
    .product-image {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .seller-box {
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 20px;
    }
    .seller-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .profile-img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }
    .buttons {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    .buttons button {
      flex: 1;
      padding: 10px;
    }
    .map-placeholder {
      height: 150px;
      background: #f2f2f2;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 좌측 영역 -->
  <div class="left">
    <!-- 상품 이미지들 -->
    <div>
      <img th:src="@{${imageList[0].imageUrl}}" alt="상품 이미지" class="product-image" />
      <!-- 여러 이미지라면 반복 처리 -->
      <!-- 예: <img th:each="img : ${imageList}" th:src="@{${img.imageUrl}}" class="product-image" /> -->
    </div>

    <!-- 판매자 정보 -->
    <div class="seller-box">
      <div class="seller-profile">
        <img th:src="@{${seller.profileImageUrl}}" class="profile-img" alt="프로필 이미지"/>
        <div>
          <strong th:text="${seller.nickname}">닉네임</strong><br/>
          <span th:text="${seller.grade}">등급</span>
        </div>
      </div>
      <div class="map-placeholder">
        [판매자 주소 표시 영역 - 지도 API 추후 연동]
      </div>
    </div>
  </div>

  <!-- 우측 영역 -->
  <div class="right">
    <h2 th:text="${product.title}">상품 제목</h2>

    <p>
      <strong th:text="'중카테고리: ' + ${product.subCategory.name}">소분류</strong> |
      <span th:text="${createdAt}">등록일</span>
    </p>

    <p><strong th:text="${product.price} + '원 / 일'">가격</strong></p>
    <p><strong th:text="'보증금: ' + ${product.deposit} + '원'">보증금</strong></p>

    <hr/>

    <div th:text="${product.description}">상품 상세 설명</div>

    <hr/>

    <p>
      관심 <span>0</span> ·
      조회수 <span th:text="${product.count != null ? product.count : 0}">0</span>
    </p>

    <div class="buttons">
      <button type="button">찜하기</button>
      <button type="button" th:if="${chatExists}">채팅방 가기</button>
      <button type="button" th:if="${!chatExists}">1:1 채팅하기</button>
    </div>
  </div>

</div>

</body>
</html>
