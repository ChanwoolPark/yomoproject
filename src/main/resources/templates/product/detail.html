<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${product.title}">상품 상세</title>

  <!-- FullCalendar CSS & JS (정확한 CDN 주소) -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <style>
    .container { display: flex; padding: 20px; gap: 40px; }
    .left, .right { flex: 1; }
    /*.product-image { width: 100%; max-height: 400px; object-fit: contain; margin-bottom: 10px; }*/
    .seller-box {
      border: 1px solid #ddd; padding: 15px; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .seller-profile { display: flex; align-items: center; gap: 10px; }
    .profile-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    .buttons { margin-top: 20px; display: flex; gap: 10px; }
    .buttons button { flex: 1; padding: 10px; }
    .map-placeholder { height: 150px; background: #f2f2f2; margin-top: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #777;  height: auto; /* ✅ 고정 높이 제거 */}

    /* 달력 부분 */
    .fc-daygrid-day.selected-start {
      background-color: #339af0 !important;  /* 진한 파랑 */
    }
    .fc-daygrid-day.selected-range {
      background-color: #d0ebff !important;  /* 연한 파랑 */
    }

    .fc-day-past {
      background-color: #f8f9fa !important;
      color: #aaa !important;
      pointer-events: none !important; /* 클릭도 막기 */
    }

    /* Swiper 버튼 색상 추가 */
    .swiper-button-next,
    .swiper-button-prev,
    .swiper-pagination-bullet{
      color: #ccc !important;
    }
    .swiper-pagination-bullet {
      background: #ccc !important;
      opacity: 1;
    }

    .swiper-pagination-bullet-active {
      background: #999 !important;
    }

    /*사용자의 다른 상품글*/
    .seller-other-products {
      margin-top: 40px;
    }

    .product-scroll-container {
      display: flex;
      overflow-x: auto;
      gap: 16px;
      padding: 10px 0;
    }

    .product-item {
      flex: 0 0 auto;
      width: 140px;
      text-align: center;
    }

    .product-item img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .product-item p {
      margin-top: 8px;
      font-size: 14px;
      color: #333;
    }
  </style>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>
<body>

<div th:replace="fragments/header :: header"></div>


<div class="container">

  <!-- 좌측 -->
  <div class="left">
    <!-- 이미지 슬라이더 -->
    <div class="swiper mySwiper" style="width: 100%; max-width: 600px; margin: 0 auto;">
      <div class="swiper-wrapper">
        <div class="swiper-slide" th:each="img : ${imageList}">
          <img th:src="@{${img.imageUrl}}"
               alt="상품 이미지"
               style="width: 100%; height: 300px; object-fit: cover;" />
        </div>
      </div>

      <!-- 네비게이션 버튼 -->
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>

      <!-- 페이지네이션 점 -->
      <div class="swiper-pagination"></div>

    </div>

    <div class="seller-box">
      <div class="seller-profile">
        <img th:src="@{${seller.profileImageUrl}}" class="profile-img" alt="프로필 이미지"/>
        <div>
          <strong th:text="${seller.nickname}">닉네임</strong><br/>
          <span th:text="${seller.grade}">등급</span>
        </div>
      </div>
    </div>
    <div class="map-placeholder">
      <div id="map" style="width:100%; height:300px;"></div>
    </div>
  </div>

  <!-- 우측 -->
  <div class="right">
    <h2 th:text="${product.title}">상품 제목</h2>

    <p>



      <strong th:text="'서브카테고리: ' + ${product.subCategory.name}">서브카테고리</strong>
      <span th:text="'거래 상태: ' + ${product.status}">거래 상태</span> |
      <span th:text="${createdAt}">등록일</span>
    </p>

    <p><strong th:text="${product.price} + '원 / 일'">가격</strong></p>
    <p><strong th:text="'보증금: ' + ${product.deposit} + '원'">보증금</strong></p>

    <hr/>

    <div th:text="${product.description}">상품 상세 설명</div>

    <hr/>

    <p>
      찜 개수 <span th:text="${wishlistCount}">0</span>명 · 조회수 <span th:text="${product.count != null ? product.count : 0}">0</span>
    </p>

    <!-- 버튼 -->
    <!-- 상단: 찜하기, 1:1 채팅 -->
    <div class="buttons" style="display: flex; gap: 10px; margin-bottom: 20px;">
      <!-- 찜 안 되어 있을 때 -->
      <button type="button"
              th:if="${!wished}"
              class="wishlist-btn"
              th:data-product-id="${product.productId}">
        찜하기
      </button>

      <!-- 찜 되어 있을 때 -->
      <button type="button"
              th:if="${wished}"
              class="unwishlist-btn"
              th:data-product-id="${product.productId}">
        찜 취소
      </button>

      <button type="button" onclick="openReservationModal()">예약 신청</button>
    </div>

    <!-- 하단: 수정, 삭제, 목록 (판매자만 수정/삭제 가능) -->
    <div class="buttons" style="display: flex; gap: 10px;">
  <span th:if="${userId == product.seller.id}">
    <a th:href="@{'/product/edit/' + ${product.productId}}">
      <button type="button">글 수정</button>
    </a>
    <form th:action="@{'/product/delete/' + ${product.productId}}" method="post" style="display:inline;" onsubmit="return confirmDelete();">
      <button type="submit">글 삭제</button>
    </form>
  </span>

      <!-- 항상 보이는 목록 버튼 -->
      <button type="button" onclick="alert('신고 기능은 준비 중입니다.')">신고하기</button>
      <a th:href="@{'/category/' + ${product.subCategory.category.categoryId}}" style="margin-left: auto;">
        <button type="button">목록</button>
      </a>
    </div>


    <!--사용자의 다른 판매글-->
    <div class="seller-other-products">
      <h3>판매자의 다른 상품</h3>
      <div class="product-scroll-container">
        <div class="product-item" th:each="p : ${otherProducts}">
          <a th:href="@{'/product/' + ${p.productId}}">
            <img th:src="@{${p.thumbnailUrl}}" alt="상품 이미지" />
            <p th:text="${p.title}">상품 제목</p>
          </a>
        </div>
      </div>
    </div>


    <!-- 삭제 확인 스크립트 -->
    <script>
      function confirmDelete() {
        return confirm("정말 삭제하시겠습니까?");
      }
    </script>

  </div>

</div>
</div>




<!-- 예약 모달 -->
<div id="reservationModal" style="display:none; position:fixed; top:10%; left:50%; transform:translateX(-50%); width:500px; background:#fff; border:1px solid #ccc; padding:20px; z-index:1000;">
  <h3>예약 신청</h3>
  <div id="calendar" style="margin-bottom: 10px;"></div>

  <form id="reservationForm" onsubmit="submitReservation(event)">
    <input type="hidden" id="startDate" name="startDate" />
    <input type="hidden" id="endDate" name="endDate" />
    <input type="hidden" id="productId" name="productId" th:value="${product.productId}" />

    <p id="datePreview">날짜를 선택해주세요</p>

    <button type="submit">예약 확정</button>
    <button type="button" onclick="closeReservationModal()">닫기</button>
  </form>

  <hr />
  <a th:href="@{'/chat/' + ${product.seller.id}}" style="text-decoration: none;">
    <button type="button" style="width: 100%; padding: 10px; margin-top: 10px;">1:1 채팅하기</button>
  </a>
</div>

<!-- 오버레이 -->
<div id="overlay" onclick="closeReservationModal()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:999;"></div>


<div th:replace="fragments/footer :: footer"></div>

<!-- 찜하기 버튼 -->
<script>
  document.addEventListener('DOMContentLoaded', function () {

    // 찜하기 버튼
    const wishlistBtn = document.querySelector('.wishlist-btn');
    if (wishlistBtn) {
      wishlistBtn.addEventListener('click', function () {
        const productId = this.dataset.productId;

        fetch('/wishlist', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ productId })
        })
                .then(res => res.json())
                .then(data => {
                  if (data.success) {
                    alert('찜 목록에 추가되었습니다!');
                    location.reload();
                  } else {
                    alert(data.message || '이미 찜한 상품입니다.');
                  }
                });
      });
    }

    // 찜취소 버튼
    const unwishlistBtn = document.querySelector('.unwishlist-btn');
    if (unwishlistBtn) {
      unwishlistBtn.addEventListener('click', function () {
        const productId = this.dataset.productId;

        fetch(`/wishlist/${productId}`, {
          method: 'DELETE'
        })
                .then(res => res.json())
                .then(data => {
                  if (data.success) {
                    alert('찜 목록에서 제거되었습니다!');
                    location.reload();
                  } else {
                    alert(data.message || '요청 실패');
                  }
                });
      });
    }

  });
</script>

<!-- 예약 부분 캘린더 JS 코드 -->
<script th:inline="javascript">
  let selectedStart = null;
  let selectedEnd = null;
  let calendar = null;

  const productId = /*[[${product.productId}]]*/ 0;

  // 모달 열기
  function openReservationModal() {
    document.getElementById('reservationModal').style.display = 'block';
    document.getElementById('overlay').style.display = 'block';

    setTimeout(() => {
      if (!calendar) {
        const calendarEl = document.getElementById('calendar');

        calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          locale: 'ko',
          selectable: true,
          selectOverlap: false,
          events: '/api/rental/reserved/' + productId,

          dateClick: function (info) {
            const clickedDate = new Date(info.date);
            clickedDate.setHours(0, 0, 0, 0);

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // 과거 날짜 선택 불가
            if (clickedDate < today) {
              alert("과거 날짜는 예약할 수 없습니다.");
              return;
            }

            // 예약된 날짜인지 확인 (종료일 포함)
            const isDisabled = calendar.getEvents().some(event => {
              const start = new Date(event.start);
              const end = new Date(event.end);
              start.setHours(0, 0, 0, 0);
              end.setHours(0, 0, 0, 0);
              return clickedDate >= start && clickedDate <= end;
            });

            if (isDisabled) {
              alert("해당 날짜는 예약할 수 없습니다.");
              return;
            }

            // 날짜 선택 처리
            if (!selectedStart || (selectedStart && selectedEnd)) {
              selectedStart = clickedDate;
              selectedEnd = null;
              document.getElementById('datePreview').innerText = selectedStart.toDateString() + " ~ ";
            } else {
              if (clickedDate < selectedStart) {
                alert("종료일은 시작일 이후여야 합니다.");
                return;
              }

              // 범위 내 예약된 날짜 겹침 확인
              const overlap = calendar.getEvents().some(event => {
                const start = new Date(event.start);
                const end = new Date(event.end);
                start.setHours(0, 0, 0, 0);
                end.setHours(0, 0, 0, 0);
                return clickedDate >= start && selectedStart <= end;
              });

              if (overlap) {
                alert("선택한 날짜 범위 중 예약된 일정이 포함되어 있습니다.");
                return;
              }

              selectedEnd = clickedDate;
              document.getElementById('datePreview').innerText =
                      selectedStart.toDateString() + " ~ " + selectedEnd.toDateString();
            }

            // 스타일 초기화 및 선택 범위 강조
            document.querySelectorAll('.fc-daygrid-day').forEach(el => el.classList.remove('selected-start', 'selected-range'));

            document.querySelectorAll('.fc-daygrid-day').forEach(dayEl => {
              const dateAttr = dayEl.getAttribute('data-date');
              if (!dateAttr) return;

              const currentDate = new Date(dateAttr);
              currentDate.setHours(0, 0, 0, 0);

              const start = selectedStart ? new Date(selectedStart) : null;
              const end = selectedEnd ? new Date(selectedEnd) : null;

              if (start && !end && currentDate.getTime() === start.getTime()) {
                dayEl.classList.add('selected-start');
              }

              if (start && end && currentDate >= start && currentDate <= end) {
                if (currentDate.getTime() === start.getTime()) {
                  dayEl.classList.add('selected-start');
                }
                dayEl.classList.add('selected-range');
              }
            });
          }
        });

        calendar.render();
      } else {
        calendar.render();
      }
    }, 100);
  }

  // 모달 닫기
  function closeReservationModal() {
    document.getElementById('reservationModal').style.display = 'none';
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('datePreview').innerText = '날짜를 선택해주세요';
    selectedStart = null;
    selectedEnd = null;
    document.querySelectorAll('.fc-daygrid-day').forEach(el => el.classList.remove('selected-start', 'selected-range'));
  }

  // 날짜 포맷 함수
  function formatDate(date) {
    const yyyy = date.getFullYear();
    const mm = ('0' + (date.getMonth() + 1)).slice(-2);
    const dd = ('0' + date.getDate()).slice(-2);
    return `${yyyy}-${mm}-${dd}`;
  }

  // 예약 확정 요청
  function submitReservation(event) {
    event.preventDefault();

    if (!selectedStart || !selectedEnd) {
      alert("시작일과 종료일을 모두 선택하세요.");
      return;
    }

    const startDateStr = formatDate(selectedStart);
    const endDateStr = formatDate(selectedEnd);

    fetch('/api/rental', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        productId: productId,
        startDate: startDateStr,
        endDate: endDateStr
      })
    })
            .then(res => {
              if (!res.ok) throw new Error("예약 실패");
              return res.text();
            })
            .then(msg => {
              alert(msg);
              closeReservationModal();
              window.location.reload();
            })
            .catch(err => alert(err.message));
  }
</script>

<!-- swiper -->
<script>
  const swiper = new Swiper(".mySwiper", {
    loop: true,
    autoplay: {
      delay: 3000,
      disableOnInteraction: false,
    },
    pagination: {
      el: ".swiper-pagination",
      clickable: true,
    },
    navigation: {
      nextEl: ".swiper-button-next",
      prevEl: ".swiper-button-prev",
    },
  });

  // product-detail.html 스크립트 부분
  document.addEventListener('DOMContentLoaded', function () {
    const chatButton = document.getElementById('chattingButton'); // 버튼 ID 추가

    if (chatButton) {
      chatButton.addEventListener('click', function () {
        const productId = /*[[${product.productId}]]*/ 0;
        const sellerId = /*[[${product.seller.id}]]*/ 0;
        const currentUserId = /*[[${userId}]]*/ 0; // 현재 로그인된 사용자 ID

        // 채팅방 생성 또는 조회 API 호출
        fetch('/api/chat/room', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            productId: productId,
            sellerId: sellerId,
            buyerId: currentUserId // 현재 사용자가 구매자가 됩니다.
          })
        })
                .then(response => response.json())
                .then(data => {
                  if (data.chatRoomId) {
                    // 성공적으로 채팅방 ID를 받으면 채팅 페이지로 이동
                    window.location.href = '/chat/' + data.chatRoomId;
                  } else {
                    alert('채팅방을 여는 데 실패했습니다.');
                  }
                })
                .catch(error => {
                  console.error('Error creating chat room:', error);
                  alert('채팅방 연결 중 오류가 발생했습니다.');
                });
      });
    }
  });
</script>


</body>
</html>
