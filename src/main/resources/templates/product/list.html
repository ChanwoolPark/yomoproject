<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        .container { display: flex; gap: 20px; padding: 20px; }
        .left, .right { width: 20%; }
        .center {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .product-box {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        .product-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        #topBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px;
        }
    </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container">

    <!-- 왼쪽: 서브카테고리 -->
    <div class="left">
        <h3>서브 카테고리</h3>
        <ul>
            <li th:each="sub : ${subCategories}">
                <a th:href="@{'/category/' + ${sub.category.categoryId} + '/subcategory/' + ${sub.subCategoryId}}"
                   th:text="${sub.name}" style="text-decoration:none; color:black;"></a>
            </li>
        </ul>
    </div>

    <!-- 중앙: 상품 리스트 -->
    <div class="center">

        <!-- 상품 올리기 버튼 -->
        <div style="grid-column: 1 / -1; text-align: right; margin-bottom: 10px;">
            <a href="/product/write" style="padding: 8px 16px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 5px;">
                상품 올리기
            </a>
        </div>

        <div th:each="product : ${products}" class="product-box-wrapper">
            <a th:href="@{'/product/' + ${product.productId}}" class="product-box-link">
                <div class="product-box">
                    <img th:src="${product.imageUrl + '?v=' + #dates.createNow().time}" alt="상품 이미지" class="product-img">
                    <h4 th:text="${product.title}"></h4>
                    <p>가격: <span th:text="${product.price}"></span>원</p>
                    <p>보증금: <span th:text="${product.deposit}"></span>원</p>
                    <p th:if="${product.createdAt != null}" th:text="${product.createdAt}"></p>
                </div>
            </a>
        </div>
    </div>

    <!-- 오른쪽: 최근 본 상품 & 찜 -->
    <div class="right">
        <h4>최근 본 상품</h4>
        <ul>
            <li th:each="item : ${recentlyViewed}">
                <span th:if="${item.product != null}" th:text="${item.product.title}">상품명</span>
            </li>
        </ul>
        <h4>찜한 상품</h4>
        <ul>
            <li th:each="wish : ${wishlist}">
                <span th:if="${wish.product != null}" th:text="${wish.product.title}">상품명</span>
            </li>
        </ul>
    </div>

</div>

<!-- Top 버튼 -->
<button id="topBtn" onclick="scrollToTop()">Top<br>버튼</button>
<script>
    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
