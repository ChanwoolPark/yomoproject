<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <link rel="stylesheet" href="/css/header.css">
    <style>
        .product-container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .product-left,
        .product-right {
            width: 20%;
        }

        .product-center {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .product-box {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        .product-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        #topBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px;
        }

        /*최근검색어*/
        .tab.active {
            border-bottom: 2px solid red;
            font-weight: bold;
            color: red;
        }
        .tab {
            background: none;
            border: none;
            outline: none;
            cursor: pointer;
        }
        #searchSuggestions li:hover {
            background-color: #f5f5f5;
        }

        /*정렬 스타일*/
        .sort-link {
            color: #333;
            text-decoration: none;
            font-weight: normal;
        }
        .sort-active {
            color: red;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<!--검색창 영역-->
<form action="/search" method="get" style="display: flex; gap: 10px; margin: 20px; position: relative; max-width: 600px;">
    <!-- 카테고리 선택 -->
    <select name="categoryId" style="padding: 8px;">
        <option value="">전체</option>
        <option th:each="cat : ${categories}"
                th:value="${cat.categoryId}"
                th:text="${cat.name}"
                th:selected="${selectedCategoryId != null and cat.categoryId == selectedCategoryId}">
        </option>
    </select>

    <!-- 검색어 입력 -->
    <input type="text" name="keyword" id="keywordInput"
           placeholder="검색어 입력"
           th:value="${keyword}"
           onfocus="showSearchSuggestions()"
           style="padding: 8px; width: 300px;" />

    <!-- 검색 버튼 -->
    <button type="submit" style="padding: 8px 16px;">검색</button>

    <!-- ▼ 추천 검색어 드롭다운 -->
    <div id="searchSuggestions"
         style="display: none; position: absolute; top: 48px; left: 0; width: 100%; background: white; border: 1px solid #ccc; z-index: 999;">

        <!-- 탭 버튼 그룹 -->
        <div style="display: flex; border-bottom: 1px solid #ddd;">
            <button type="button"
                    id="tab-recent"
                    th:class="${sourceTab == null or sourceTab == 'recent'} ? 'tab active' : 'tab'"
                    onclick="switchTab('recent')"
                    style="flex: 1; padding: 10px; font-weight: bold; cursor: pointer;">
                최근검색어
            </button>

            <button type="button"
                    id="tab-popular"
                    th:class="${sourceTab == 'popular'} ? 'tab active' : 'tab'"
                    onclick="switchTab('popular')"
                    style="flex: 1; padding: 10px; font-weight: bold; cursor: pointer;">
                인기검색어
            </button>
        </div>

        <!-- 추천어 리스트 -->
        <ul id="recentList" style="list-style: none; margin: 0; padding: 10px;"></ul>
        <ul id="popularList" style="list-style: none; margin: 0; padding: 10px; display: none;"></ul>
    </div>
</form>

<div class="product-container">

    <!-- 왼쪽: 서브카테고리 -->
    <div class="product-left">
        <h3 th:if="${isSearch and selectedCategoryId == null}">🔍 전체 검색 중입니다</h3>
        <h3 th:unless="${isSearch and selectedCategoryId == null}">서브 카테고리</h3>

        <ul th:if="${not (isSearch and selectedCategoryId == null)}">
            <li th:each="sub : ${subCategories}">
                <a th:href="@{'/category/' + ${sub.category.categoryId} + '/subcategory/' + ${sub.subCategoryId}}"
                   th:text="${sub.name}" style="text-decoration:none; color:black;"></a>
            </li>
        </ul>

        <!--가격 필터 칸-->
        <div th:if="${subCategoryId != null and category != null}">
            <!-- 서브카테고리 전용 필터 -->
            <form th:action="@{/category/{categoryId}/subcategory/{subCategoryId}(categoryId=${category.categoryId}, subCategoryId=${subCategoryId})}"
                  method="get"
                  style="margin-top: 20px;"
                  onsubmit="return validatePriceRange()">
                <input type="number" name="minPrice" id="minPrice1" placeholder="최소 가격" style="width: 80px;" th:value="${param.minPrice}" />
                ~
                <input type="number" name="maxPrice" id="maxPrice1" placeholder="최대 가격" style="width: 80px;" th:value="${param.maxPrice}" />
                <button type="submit" style="margin-top: 10px;">가격 필터</button>
            </form>
        </div>
        <div th:if="${subCategoryId == null and category != null}">
            <!-- 대카테고리 또는 전체 검색용 필터 -->
            <form th:action="@{/category/{categoryId}(categoryId=${category.categoryId})}"
                  method="get"
                  style="margin-top: 20px;"
                  onsubmit="return validatePriceRange()">
                <input type="number" name="minPrice" id="minPrice" placeholder="최소 가격" style="width: 80px;" th:value="${param.minPrice}" />
                ~
                <input type="number" name="maxPrice" id="maxPrice" placeholder="최대 가격" style="width: 80px;" th:value="${param.maxPrice}" />
                <button type="submit" style="margin-top: 10px;">가격 필터</button>
            </form>
        </div>
    </div>

    <!-- 중앙: 상품 리스트 -->
    <div class="product-center">

        <!-- 게시글 정렬 & 상품 올리기 -->
        <div style="grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div th:if="${not isSearch and not isPriceFiltered}" style="display: flex; gap: 10px; align-items: center;">
                <span>정렬:</span>

                <!-- 서브카테고리 정렬 링크 -->
                <div th:if="${subCategoryId != null}">
                    <a th:href="@{|/category/${category.categoryId}/subcategory/${subCategoryId}?sort=${'latest'}|}"
                       th:class="${currentSort == 'latest'} ? 'sort-active' : 'sort-link'">최신순</a>

                    <a th:href="@{|/category/${category.categoryId}/subcategory/${subCategoryId}?sort=${'views'}|}"
                       th:class="${currentSort == 'views'} ? 'sort-active' : 'sort-link'">조회순</a>

                    <a th:href="@{|/category/${category.categoryId}/subcategory/${subCategoryId}?sort=${'price'}|}"
                       th:class="${currentSort == 'price'} ? 'sort-active' : 'sort-link'">가격 낮은순</a>
                </div>

                <!-- 대카테고리 정렬 링크 -->
                <div th:if="${subCategoryId == null}">
                    <a th:href="@{|/category/${category.categoryId}?sort=${'latest'}|}"
                       th:class="${currentSort == 'latest'} ? 'sort-active' : 'sort-link'">최신순</a>

                    <a th:href="@{|/category/${category.categoryId}?sort=${'views'}|}"
                       th:class="${currentSort == 'views'} ? 'sort-active' : 'sort-link'">조회순</a>

                    <a th:href="@{|/category/${category.categoryId}?sort=${'price'}|}"
                       th:class="${currentSort == 'price'} ? 'sort-active' : 'sort-link'">가격 낮은순</a>
                </div>
            </div>

            <!-- 상품 글쓰기 버튼 -->
            <a th:href="@{'/product/write?categoryId=' + ${category != null ? category.categoryId : ''}}"
               style="padding: 8px 16px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 5px;">
                상품 글쓰기
            </a>
        </div>

        <!-- 검색 결과가 없을 때 -->
        <div th:if="${#lists.isEmpty(products)}" style="grid-column: 1 / -1; text-align: center;">
            <p>🔍 검색 결과가 없습니다.</p>
        </div>

        <!-- 검색 결과가 있을 때 -->
        <div th:each="product : ${products}" class="product-box-wrapper">
            <a th:href="@{'/product/' + ${product.productId}}" class="product-box-link">
                <div class="product-box">
                    <img th:src="${product.imageUrl + '?v=' + #dates.createNow().time}" alt="상품 이미지" class="product-img">
                    <h4 th:text="${product.title}"></h4>
                    <p>가격: <span th:text="${product.price}"></span>원</p>
                    <p>보증금: <span th:text="${product.deposit}"></span>원</p>
                    <p th:if="${product.createdAt != null}" th:text="${product.createdAt}"></p>
                </div>
            </a>
        </div>
    </div>

    <!-- 오른쪽: 최근 본 상품 & 찜 -->
    <div class="product-right">
        <h4>최근 본 상품</h4>
        <div class="recently-viewed-items">
            <div th:each="item : ${recentlyViewed}" class="recent-item" style="display: flex; margin-bottom: 10px;">
                <img th:src="${item.product.thumbnailUrl}" alt="최근 본 이미지" style="width: 60px; height: 60px; object-fit: cover; margin-right: 10px;">
                <a th:href="@{'/product/' + ${item.product.productId}}" th:text="${item.product.title}" style="font-size: 14px;"></a>
            </div>
        </div>
        <div class="wishlist-box">
            <h4>관심목록</h4>
            <div class="wishlist-items">
                <div th:each="item : ${wishlist}" class="wishlist-item" style="display: flex; margin-bottom: 10px;">
                    <img th:src="${item.imageUrl}" alt="찜한 상품" style="width: 60px; height: 60px; object-fit: cover; margin-right: 10px;">
                    <a th:href="@{'/product/' + ${item.productId}}" th:text="${item.title}" style="font-size: 14px;"></a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Top 버튼 -->
<button id="topBtn" onclick="scrollToTop()">Top<br>버튼</button>
<script>
    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>








<!--인기 검색어 / 최근 검색어 동작-->
<script>
    // 추천 박스 표시
    function showSearchSuggestions() {
        document.getElementById("searchSuggestions").style.display = "block";
        loadRecentKeywords();
        loadPopularKeywords();
    }

    // 탭 전환
    function switchTab(tab) {
        document.getElementById("recentList").style.display = tab === 'recent' ? 'block' : 'none';
        document.getElementById("popularList").style.display = tab === 'popular' ? 'block' : 'none';
        document.getElementById("tab-recent").classList.toggle("active", tab === 'recent');
        document.getElementById("tab-popular").classList.toggle("active", tab === 'popular');
    }

    // 최근 검색어 로딩 (세션Storage 또는 서버 세션)
    function loadRecentKeywords() {
        fetch("/session-keywords") // 서버 세션에서 가져오는 방식
            .then(res => res.json())
            .then(data => {
                const ul = document.getElementById("recentList");
                ul.innerHTML = data.length === 0
                    ? "<li>최근 검색어가 없습니다.</li>"
                    : data.map(k => `<li style="cursor:pointer;" onclick="goSearch('${k}', 'recent')">${k}</li>`).join("")
            });
    }

    // 인기 검색어 로딩 (조회수 기준)
    function loadPopularKeywords() {
        fetch("/api/popular-keywords")
            .then(res => res.json())
            .then(data => {
                const ul = document.getElementById("popularList");
                ul.innerHTML = data.length === 0
                    ? "<li>인기 검색어가 없습니다.</li>"
                    : data.map(k => `<li style="cursor:pointer;" onclick="goSearch('${k}', 'popular')">${k}</li>`).join("")
            });
    }

    // 검색 실행
    function goSearch(keyword, sourceTab) {
        if (sourceTab === 'popular') {
            switchTab('popular');
        } else {
            switchTab('recent');
        }
        location.href = "/search?keyword=" + encodeURIComponent(keyword) + "&sourceTab=" + sourceTab;
    }

    // 외부 클릭 시 닫기
    document.addEventListener("click", function(e) {
        const box = document.getElementById("searchSuggestions");
        const input = document.getElementById("keywordInput");
        if (!box.contains(e.target) && e.target !== input) {
            box.style.display = "none";
        }
    });
</script>

<!--가격 오류 알림-->
<script>
    function validatePriceRange() {
        // 대카테고리용 기본 필터 (id="minPrice", "maxPrice")
        const min1 = document.getElementById("minPrice");
        const max1 = document.getElementById("maxPrice");

        if (min1 && max1) {
            const minVal = min1.value;
            const maxVal = max1.value;

            if (minVal && maxVal && parseInt(maxVal) < parseInt(minVal)) {
                alert("최대 가격은 최소 가격보다 커야 합니다.");
                return false;
            }
        }

        // 서브카테고리용 필터 (id="minPrice1", "maxPrice1")
        const min2 = document.getElementById("minPrice1");
        const max2 = document.getElementById("maxPrice1");

        if (min2 && max2) {
            const minVal = min2.value;
            const maxVal = max2.value;

            if (minVal && maxVal && parseInt(maxVal) < parseInt(minVal)) {
                alert("최대 가격은 최소 가격보다 커야 합니다.");
                return false;
            }
        }

        return true;
    }
</script>

</body>
</html>
