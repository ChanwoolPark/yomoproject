<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>상품 수정</title>
  <style>
    .form-container {
      width: 600px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background-color: #fafafa;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #bbb;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .image-preview img {
      width: 100px;
      margin-right: 10px;
    }

    .back-btn {
      padding: 8px 18px;
      background: #aaa;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 1rem;
    }
    .back-btn:hover {
      background: #888;
    }
  </style>

</head>
<body>






<div class="form-container">
  <h2>상품 수정</h2>
  <form th:action="@{'/product/edit/' + ${product.productId}}" method="post" enctype="multipart/form-data">
    <div class="form-group">
      <label for="status">거래 상태</label>
      <select id="status" name="status">
        <option value="판매중" th:selected="${product.status == '판매중'}">판매중</option>
        <option value="예약중" th:selected="${product.status == '예약중'}">예약중</option>
        <option value="대여중" th:selected="${product.status == '대여중'}">대여중</option>
        <option value="삭제됨" th:selected="${product.status == '삭제됨'}">삭제됨</option>
      </select>
      </select>
    </div>
    <div class="form-group">
      <label for="subCategoryId">카테고리</label>
      <select id="subCategoryId" name="subCategoryId" required>
        <option th:each="sub : ${subCategories}"
                th:value="${sub.subCategoryId}"
                th:text="${sub.name}"
                th:selected="${sub.subCategoryId == product.subCategory.subCategoryId}">카테고리</option>
      </select>
    </div>

    <div class="form-group">
      <label for="title">상품명</label>
      <input type="text" id="title" name="title" th:value="${product.title}" required>
    </div>

    <div class="form-group">
      <label for="price">가격 (원)</label>
      <input type="number" id="price" name="price" th:value="${product.price}" required>
    </div>

    <div class="form-group">
      <label for="deposit">보증금 (원)</label>
      <input type="number" id="deposit" name="deposit" th:value="${product.deposit}">
    </div>

    <div class="form-group">
      <label for="description">상품 설명</label>
      <textarea id="description" name="description" rows="6" th:text="${product.description}"></textarea>
    </div>

    <div class="form-group">
      <label for="images">상품 이미지 (최대 3장)</label>
      <input type="file" id="images" name="images" multiple accept="image/*">
      <div class="image-preview">
        <img th:each="img : ${imageList}" th:src="@{${img.imageUrl}}" alt="기존 이미지"/>
      </div>
    </div>

    <div style="text-align: center;">
      <button type="submit">수정하기</button>
    </div>
  </form>
</div>

<div style="text-align:center; margin-top: 20px;">
  <button type="button" class="back-btn" th:onclick="|location.href='/product/' + ${product.productId}|">뒤로가기</button>
</div>


</body>
</html>
