<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>휴면 계정 안내</title>
    <meta charset="UTF-8">
</head>
<body>
<h2>휴면 계정입니다</h2>
<p>고객님, 장기간 미접속으로 인해 계정이 휴면 상태입니다.</p>
<p>휴면 해제를 위해 이메일 인증이 필요합니다.</p>
<form th:action="@{/dormant/send-auth}" method="post">
    <input type="hidden" name="email" th:value="${user.email}">
    <button type="submit">이메일 인증 요청</button>
</form>
</body>
</html>
