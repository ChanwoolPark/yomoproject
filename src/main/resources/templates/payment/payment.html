<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>결제 페이지</title>
</head>
<body>
<h2>대여 결제</h2>
<p>구매자: <span th:text="${user.nickname}"></span></p>
<p>상품명: <span th:text="${product.title}"></span></p>
<p>판매자: <span th:text="${seller.nickname}"></span></p>
<p>대여기간: <span th:text="${#dates.format(rental.startDate, 'yyyy-MM-dd')}"></span> ~
  <span th:text="${#dates.format(rental.endDate, 'yyyy-MM-dd')}"></span></p>
<p>가격: <span th:text="${totalPrice}"></span> 포인트</p>
<p>보증금: <span th:text="${deposit}"></span> 포인트</p>
<p>내 잔액: <span th:text="${balance}"></span> 포인트</p>
<form method="post" th:action="@{/payment/submit}">
  <input type="hidden" name="rentalId" th:value="${rental.rentalId}" />
  <button type="submit">결제하기</button>
</form>
<div th:if="${error}" style="color:red;" th:text="${error}"></div>
</body>
</html>
