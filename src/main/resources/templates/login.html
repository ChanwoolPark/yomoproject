<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>
  <style>
    .btn { padding: 10px 20px; margin: 10px; border: none; cursor: pointer; }
    .google { background: #db4437; color: white; }
    .kakao  { background: #fee500; color: #3c1e1e; }
    .naver  { background: #03c75a; color: white; }
    .login  { background: #555; color: white; }
    .link-group {
      margin-top: 20px;
      font-size: 14px;
      display: flex;
      gap: 15px;
    }
    .link-group a {
      color: blue;
      text-decoration: underline;
      cursor: pointer;
    }
    .signup-section {
      margin-top: 20px;
      font-size: 14px;
    }
    .signup-section a {
      color: blue;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
<h1>로그인</h1>

<!-- 일반 로그인 버튼 -->
<button class="btn login" onclick="location.href='/login/form'">
  일반 로그인
</button>

<!-- 소셜 로그인 버튼들 -->
<button class="btn google" onclick="location.href='/oauth2/authorization/google'">
  Google 로그인
</button>
<button class="btn kakao" onclick="location.href='/oauth2/authorization/kakao'">
  Kakao 로그인
</button>
<button class="btn naver" onclick="location.href='/oauth2/authorization/naver'">
  Naver 로그인
</button>

<!-- 회원가입 링크 -->
<div class="signup-section">
  아이디나 비밀번호가 없으신가요? <a href="/signup">회원가입</a>
</div>
</body>
</html>
