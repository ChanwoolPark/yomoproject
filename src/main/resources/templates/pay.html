<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>포인트 결제</title>
    <style>
        .pay-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 32px 24px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 32px 0 rgba(0,0,0,0.07);
        }
        .pay-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .pay-label {
            font-weight: 500;
        }
        .pay-row {
            margin-bottom: 16px;
        }
        .pay-value {
            font-weight: 400;
            float: right;
        }
        .pay-btn {
            width: 100%;
            background: #3182f6;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            border: none;
            padding: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 24px;
        }
        .pay-btn:active {
            background: #1b64da;
        }
    </style>
</head>
<body>
<div class="pay-container">
    <div class="pay-title">포인트 결제</div>
    <div class="pay-row">
        <span class="pay-label">상품명</span>
        <span class="pay-value" th:text="${productName}">상품명</span>
    </div>
    <div class="pay-row">
        <span class="pay-label">대여기간</span>
        <span class="pay-value" th:text="${rentalPeriod}">2025-05-22 ~ 2025-05-25</span>
    </div>
    <div class="pay-row">
        <span class="pay-label">금액</span>
        <span class="pay-value" th:text="${price}">30,000</span> 원
    </div>
    <div class="pay-row">
        <span class="pay-label">보증금</span>
        <span class="pay-value" th:text="${deposit}">10,000</span> 원
    </div>
    <form th:action="@{/pay/process}" method="post">
        <input type="hidden" name="productId" th:value="${productId}" />
        <input type="hidden" name="rentalStart" th:value="${rentalStart}" />
        <input type="hidden" name="rentalEnd" th:value="${rentalEnd}" />
        <input type="hidden" name="price" th:value="${price}" />
        <input type="hidden" name="deposit" th:value="${deposit}" />
        <button type="submit" class="pay-btn">결제하기</button>
    </form>
</div>
</body>
</html>
