<form id="pwFindForm">
    <input type="text" name="username" placeholder="아이디" required>
    <input type="email" name="email" placeholder="이메일" required>
    <button type="button" id="sendCodeBtn">인증번호 발송</button>
</form>
<div id="verifyDiv" style="display:none;">
    <input type="text" id="verifyCodeInput" placeholder="인증번호 입력">
    <button type="button" id="verifyBtn">인증번호 확인</button>
</div>
<div id="resetDiv" style="display:none;">
    <input type="password" id="newPasswordInput" placeholder="새 비밀번호">
    <button type="button" id="resetBtn">비밀번호 재설정</button>
</div>
<div id="resultMsg"></div>

<script>
    const usernameInput = document.querySelector('[name="username"]');
    const emailInput = document.querySelector('[name="email"]');

    document.getElementById('sendCodeBtn').onclick = async function() {
        const res = await fetch('/api/user/send-verify-code', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `username=${encodeURIComponent(usernameInput.value)}&email=${encodeURIComponent(emailInput.value)}`
        });
        document.getElementById('resultMsg').innerText = await res.text();
        if (res.ok) document.getElementById('verifyDiv').style.display = '';
    };

    document.getElementById('verifyBtn').onclick = async function() {
        const code = document.getElementById('verifyCodeInput').value;
        const res = await fetch('/api/user/verify-code', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `code=${encodeURIComponent(code)}`
        });
        const result = await res.text();
        document.getElementById('resultMsg').innerText = result;
        if (result.includes("성공")) {
            document.getElementById('resetDiv').style.display = '';
        }
    };

    document.getElementById('resetBtn').onclick = async function() {
        const newPw = document.getElementById('newPasswordInput').value;
        const res = await fetch('/api/user/reset-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `username=${encodeURIComponent(usernameInput.value)}&newPassword=${encodeURIComponent(newPw)}`
        });
        document.getElementById('resultMsg').innerHTML = await res.text();

    };

    document.getElementById('resetBtn').onclick = async function() {
        const newPw = document.getElementById('newPasswordInput').value;
        // 유효성 검사 (영어, 숫자, 특수문자 8~20자)
        const pwRegex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()_+\-={}\[\]:;"'<>,.?/\\|`~]).{8,20}$/;
        if (!pwRegex.test(newPw)) {
            document.getElementById('resultMsg').innerText =
                "비밀번호는 영어, 숫자, 특수문자를 포함하여 8~20자여야 합니다.";
            return;
        }
        const res = await fetch('/api/user/reset-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `username=${encodeURIComponent(usernameInput.value)}&newPassword=${encodeURIComponent(newPw)}`
        });
        document.getElementById('resultMsg').innerHTML = await res.text();
    };

</script>
