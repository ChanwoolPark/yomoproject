<!-- src/main/resources/templates/admin/product_report_detail.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 신고 상세</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<h1>상품 신고 상세</h1>
<table>
    <tr>
        <th>신고번호</th>
        <td th:text="${report.reportId}"></td>
    </tr>
    <tr>
        <th>신고자</th>
        <td th:text="${report.reporter.username}"></td>
    </tr>
    <tr>
        <th>상품ID</th>
        <td th:text="${report.product.productId}"></td>
    </tr>
    <tr>
        <th>상품명</th>
        <td th:text="${report.product.title}"></td>
    </tr>
    <tr>
        <th>제목</th>
        <td th:text="${report.title}"></td>
    </tr>
    <tr>
        <th>신고내용</th>
        <td th:text="${report.details}"></td>
    </tr>
    <tr>
        <th>신고일시</th>
        <td th:text="${#temporals.format(report.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    <tr>
        <th>상태</th>
        <td>
            <form th:action="@{'/admin/product-report/' + ${report.reportId} + '/status'}" method="post" style="display:inline;">
                <select name="status">
                    <option th:value="접수" th:selected="${report.status == '접수'}">접수</option>
                    <option th:value="처리중" th:selected="${report.status == '처리중'}">처리중</option>
                    <option th:value="완료" th:selected="${report.status == '완료'}">완료</option>
                </select>
                <button type="submit">변경</button>
            </form>
        </td>
    </tr>
</table>
<div>
    <a th:href="@{/admin/product-reports}" class="btn">목록으로</a>
</div>
</body>
</html>
