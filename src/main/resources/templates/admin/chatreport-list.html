<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>신고 리스트</title>
</head>
<body>
<table>
  <thead>
  <tr>
    <th>신고번호</th>
    <th>채팅방</th>
    <th>신고자</th>
    <th>피신고자</th>
    <th>제목</th>
    <th>상태</th>
    <th>상세</th>
  </tr>
  </thead>
  <tbody>
  <!-- Thymeleaf 반복문 예시 -->
  <tr th:each="report : ${reportList}">
    <td th:text="${report.reportId}"></td>
    <td th:text="${report.chatRoomId}"></td>
    <td th:text="${report.reporterId}"></td>
    <td th:text="${report.reportedId}"></td>
    <td th:text="${report.title}"></td>
    <td th:text="${report.status}"></td>
    <td>
      <a th:href="@{'/admin/report/' + ${report.reportId}}">상세</a>
    </td>
  </tr>
  </tbody>
</table>


</body>
</html>
