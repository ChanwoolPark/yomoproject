<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>고객 문의 목록</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background: #f8f8ff;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 50px auto 0 auto;
            background: #fff;
            padding: 36px 40px 32px 40px;
            border-radius: 22px;
            box-shadow: 0 4px 16px rgba(124,77,255,0.05), 0 1.5px 8px #eee;
        }
        .list-title {
            font-size: 28px;
            font-weight: bold;
            color: #7c4dff;
            margin-bottom: 18px;
            text-align: left;
        }
        .yomo-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 12px;
            background: #faf9ff;
            border-radius: 18px;
            box-shadow: 0 2px 8px #f3ecff;
            overflow: hidden;
        }
        .yomo-table th, .yomo-table td {
            padding: 13px 10px;
            text-align: left;
        }
        .yomo-table th {
            background: #f2f2ff;
            color: #7c4dff;
            font-size: 16px;
            font-weight: 700;
            border-bottom: 2px solid #eee;
        }
        .yomo-table td {
            font-size: 15px;
            color: #312661;
            background: #fff;
            border-bottom: 1px solid #f3ecff;
        }
        .yomo-table tr:last-child td {
            border-bottom: none;
        }
        .yomo-table a {
            color: #7c4dff;
            font-weight: 500;
            text-decoration: none;
            border-radius: 7px;
            padding: 5px 12px;
            background: #f3ecff;
            transition: background 0.15s;
        }
        .yomo-table a:hover {
            background: #e1d6ff;
        }
        .status-done {
            color: #fff;
            background: #7c4dff;
            border-radius: 8px;
            padding: 4px 12px;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
        }
        .status-wait {
            color: #7c4dff;
            background: #ede6ff;
            border-radius: 8px;
            padding: 4px 12px;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
        }
        @media (max-width: 700px) {
            .container { padding: 12px; }
            .list-title { font-size: 21px; }
            .yomo-table th, .yomo-table td { font-size: 13px; padding: 8px 5px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="list-title">고객 문의 목록</div>
    <table class="yomo-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>제목</th>
            <th>이메일</th>
            <th>작성일</th>
            <th>답변 상태</th>
            <th>보기</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inq : ${inquiries}">
            <td th:text="${inq.id}"></td>
            <td th:text="${inq.title}"></td>
            <td th:text="${inq.email}"></td>
            <td th:text="${#temporals.format(inq.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <span th:if="${inq.answer != null}" class="status-done">답변 완료</span>
                <span th:if="${inq.answer == null}" class="status-wait">미답변</span>
            </td>
            <td>
                <a th:href="@{'/admin/inquiries/' + ${inq.id}}">상세</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(inquiries)}">
            <td colspan="6" style="text-align:center; color:#bbb; padding:28px 0;">문의 내역이 없습니다.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
