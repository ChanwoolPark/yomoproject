<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>문의 목록</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ccc; text-align: left; }
        th { background-color: #f2f2f2; }
        a { color: #7c4dff; text-decoration: none; }
    </style>
</head>
<body>
<h2>고객 문의 목록</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>제목</th>
        <th>이메일</th>
        <th>작성일</th>
        <th>답변 상태</th>
        <th>보기</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="inq : ${inquiries}">
        <td th:text="${inq.id}"></td>
        <td th:text="${inq.title}"></td>
        <td th:text="${inq.email}"></td>
        <td th:text="${#temporals.format(inq.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${inq.answer != null ? '답변 완료' : '미답변'}"></td>
        <td><a th:href="@{'/admin/inquiries/' + ${inq.id}}">상세</a></td>
    </tr>
    </tbody>
</table>
</body>
</html>
