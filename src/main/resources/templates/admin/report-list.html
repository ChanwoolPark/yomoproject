<!-- templates/admin/report-list.html -->
<h2>신고 목록</h2>
<table>
  <tr>
    <th>신고 ID</th>
    <th>신고자</th>
    <th>피신고자</th>
    <th>사유</th>
    <th>상태</th>
    <th>처리</th>
  </tr>
  <tr th:each="report : ${reports}">
    <td th:text="${report.id}"></td>
    <td th:text="${report.reporter.nickname}"></td>
    <td th:text="${report.reported.nickname}"></td>
    <td th:text="${report.reason}"></td>
    <td th:text="${report.status}"></td>
    <td>
      <form th:action="@{/templates/admin/reports/process}" method="post">
        <input type="hidden" th:name="id" th:value="${report.id}"/>
        <select name="action">
          <option value="WARN">경고</option>
          <option value="BAN">정지</option>
          <option value="IGNORE">무시</option>
        </select>
        <button type="submit">처리</button>
      </form>
    </td>
  </tr>
</table>
