<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>포인트 충전</title>
    <style>
        .charge-container {
            max-width: 430px;
            margin: 50px auto;
            padding: 2rem;
            border: 1px solid #eee;
            border-radius: 12px;
            background: #fafbff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .charge-container h2 {
            margin-bottom: 1.2rem;
            text-align: center;
        }
        .user-point {
            margin-bottom: 1.6rem;
            text-align: right;
            font-size: 1.08rem;
            color: #222;
            font-weight: bold;
        }
        .charge-container label {
            font-weight: bold;
            display: block;
            margin-bottom: 0.5rem;
        }
        .charge-container input[type="number"],
        .charge-container select {
            width: 100%;
            padding: 0.7rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 1.2rem;
        }
        .charge-container button {
            width: 100%;
            padding: 0.8rem;
            background: #4477ee;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        .charge-history {
            margin-top: 2rem;
        }
        .charge-history h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .charge-history table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .charge-history th, .charge-history td {
            border: 1px solid #ddd;
            padding: 0.5rem 0.4rem;
            text-align: center;
        }
        .charge-history th {
            background: #f3f6fc;
        }
    </style>
</head>
<body>
<!-- 헤더 -->
<div th:replace="fragments/header :: header"></div>

<div class="charge-container">
    <h2>포인트 충전</h2>
    <!-- 유저 포인트 표시 (백엔드에서 point 값 내려주면 th:text로 출력) -->
    <div class="user-point">
        내 포인트: <span th:text="${point}">12,000</span> P
    </div>
    <form action="#" method="post">
        <label for="chargeAmount">충전 금액</label>
        <input type="number" id="chargeAmount" name="chargeAmount" placeholder="충전할 금액 입력" min="1000" step="1000" required>

        <label for="payMethod">결제 수단</label>
        <select id="payMethod" name="payMethod" required>
            <option value="" disabled selected>결제 수단 선택</option>
            <option value="kakaopay">카카오페이</option>
            <option value="toss">토스</option>
            <option value="credit">신용/체크카드</option>
            <option value="bank">계좌이체</option>
        </select>

        <button type="submit">충전하기</button>
    </form>
    <div class="charge-history">
        <h3>최근 충전 내역</h3>
        <table>
            <thead>
            <tr>
                <th>날짜</th>
                <th>금액</th>
                <th>결제수단</th>
                <th>상태</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>2025-05-19</td>
                <td>10,000P</td>
                <td>카카오페이</td>
                <td>완료</td>
            </tr>
            <tr>
                <td>2025-05-10</td>
                <td>5,000P</td>
                <td>토스</td>
                <td>완료</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 푸터 -->
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
