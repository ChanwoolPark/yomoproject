<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신고하기</title>
  <style>
    body {
      font-family: sans-serif;
    }
    .report-container {
      width: 400px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"],
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 3px;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    button {
      background-color: #5cb85c;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #4cae4c;
    }
  </style>
</head>
<body>
<div class="report-container">
  <h2>신고하기</h2>
  <form action="/submit-report" method="post">
    <div class="form-group">
      <label for="reportType">신고 유형:</label>
      <select id="reportType" name="reportType">
        <option value="user">사용자 신고</option>
        <option value="content">게시물 신고</option>
        <option value="other">기타</option>
      </select>
    </div>
    <div class="form-group">
      <label for="target">신고 대상:</label>
      <input type="text" id="target" name="target" placeholder="신고 대상 (사용자 ID, 게시물 ID 등)">
    </div>
    <div class="form-group">
      <label for="reason">신고 사유:</label>
      <textarea id="reason" name="reason" placeholder="신고 사유를 자세히 작성해주세요."></textarea>
    </div>
    <button type="submit">신고 제출</button>
  </form>
</div>
</body>
</html>
