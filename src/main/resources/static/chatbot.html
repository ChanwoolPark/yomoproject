<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>챗봇</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .chat-container {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .chat-message {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .user {
            text-align: right;
            color: #1a73e8;
        }
        .bot {
            text-align: left;
            color: #333;
        }
        .input-area {
            display: flex;
            border-top: 1px solid #ddd;
        }
        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: none;
            font-size: 16px;
        }
        button {
            padding: 15px 20px;
            border: none;
            background: #1a73e8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #1558b0;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-box" id="chat-box" role="log" aria-live="polite"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="메시지를 입력하세요..." autocomplete="off" />
        <button id="send-btn">전송</button>
    </div>
</div>

<script>
    const input = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(text, className) {
        const msg = document.createElement('div');
        msg.className = `chat-message ${className}`;
        msg.textContent = text;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const message = input.value.trim();
        if (message === '') return;

        appendMessage(`나: ${message}`, 'user');

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });

            if (!response.ok) {
                throw new Error('서버 오류');
            }

            const data = await response.json(); // 서버에서 JSON 응답을 기대합니다.
            appendMessage(`챗봇: ${data.reply}`, 'bot');

        } catch (error) {
            appendMessage('챗봇: 오류가 발생했습니다.', 'bot');
        }

        input.value = '';
        input.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
