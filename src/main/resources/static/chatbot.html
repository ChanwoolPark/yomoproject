<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yomozomo 챗봇</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden; /* 페이지 전체 스크롤 방지 */
        }
        .chat-container {
            width: 100%;
            max-width: 450px; /* 데스크탑에서 최대 너비 제한 */
            height: 100vh; /* 뷰포트 전체 높이를 차지하도록 */
            background-color: #ffffff;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            display: flex;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 1px solid #eee;
            background-color: #fff;
            flex-shrink: 0; /* 헤더는 크기가 줄어들지 않도록 고정 */
        }
        .chat-header .back-arrow {
            font-size: 24px;
            color: #333;
            margin-right: 10px;
            cursor: pointer;
            text-decoration: none;
        }
        .chat-header h1 {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin: 0;
            flex-grow: 1;
            text-align: center;
        }
        .chat-body {
            flex-grow: 1; /* 메시지 영역이 남은 공간을 모두 차지하도록 */
            padding: 20px 15px; /* 좌우 패딩 조정 */
            overflow-y: auto; /* 내용이 길어지면 스크롤 가능하게 */
            -webkit-overflow-scrolling: touch; /* iOS에서 부드러운 스크롤 */
            display: flex;
            flex-direction: column;
            /* 메시지는 위에서 아래로 쌓이도록 기본 정렬 유지 */
            /* justify-content: flex-end; // 메시지를 아래에 정렬하려면 이 주석을 해제 */
        }
        .message-row {
            display: flex;
            margin-bottom: 15px; /* 메시지 줄 간 간격 */
        }
        .message-row.bot {
            justify-content: flex-start;
        }
        .message-row.user {
            justify-content: flex-end;
        }
        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px; /* 더 둥근 모서리 */
            font-size: 15px;
            line-height: 1.5;
            max-width: 75%; /* 말풍선 최대 너비 */
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); /* 은은한 그림자 */
        }
        .message-bubble.bot {
            background-color: #e6e6e6; /* 챗봇 메시지 배경 */
            color: #333;
            border-bottom-left-radius: 4px; /* 토스 UI처럼 한쪽 모서리를 덜 둥글게 */
            position: relative;
            /* 챗봇 아이콘을 위한 공간 확보 */
            margin-left: 40px; /* 챗봇 아이콘 너비 + 간격 */
        }
        .message-bubble.bot::before {
            content: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23000000" width="20px" height="20px"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>'); /* 챗봇 아이콘 SVG */
            position: absolute;
            left: -35px; /* 말풍선 왼쪽으로 이동 */
            top: 50%;
            transform: translateY(-50%);
            width: 30px; /* 아이콘 크기 */
            height: 30px;
            background-color: #f0f0f0; /* 아이콘 배경 */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .message-bubble.user {
            background-color: #2196f3; /* 사용자 메시지 배경 */
            color: white;
            border-bottom-right-radius: 4px; /* 토스 UI처럼 한쪽 모서리를 덜 둥글게 */
        }
        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }
        .message-row.bot .message-time {
            margin-right: auto; /* 챗봇 메시지 시간 왼쪽 정렬 */
            margin-left: 50px; /* 아이콘 + 버블 간격 고려 */
        }
        .message-row.user .message-time {
            margin-left: auto; /* 사용자 메시지 시간 오른쪽 정렬 */
        }


        /* 옵션 버튼 스타일 (사용자 직접 입력 모드에서는 사라지거나 다른 역할) */
        .options-container {
            display: flex;
            flex-wrap: wrap; /* 여러 줄로 감싸기 */
            justify-content: flex-start;
            padding: 10px 15px;
            border-top: 1px solid #eee;
            background-color: #fff;
            flex-shrink: 0; /* 고정 */
        }
        .options-container button {
            /* 토스 UI의 하단 선택지 버튼 스타일 */
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 20px; /* 둥근 버튼 */
            padding: 8px 15px;
            margin: 5px; /* 버튼 간 간격 */
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap; /* 텍스트가 줄바꿈되지 않도록 */
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .options-container button:hover {
            background-color: #e0e0e0;
            border-color: #ccc;
        }

        /* 하단 고정 입력 필드 */
        .input-area {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-top: 1px solid #eee;
            background-color: #fff;
            flex-shrink: 0; /* 입력창은 크기가 줄어들지 않도록 고정 */
        }
        .input-area input[type="text"] {
            flex-grow: 1; /* 입력 필드가 남은 공간을 차지 */
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 25px; /* 아주 둥근 입력 필드 */
            font-size: 15px;
            outline: none; /* 포커스 시 아웃라인 제거 */
            margin-right: 10px;
        }
        .input-area button {
            background-color: transparent; /* 배경 없음 */
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-area button svg {
            fill: #2196f3; /* 전송 아이콘 색상 */
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <a th:href="@{/chatbot}" class="back-arrow">&#x2190;</a> <h1>Yomozomo 챗봇</h1>
    </div>

    <div th:if="${errorMessage}" class="error-message">
        <p th:text="${errorMessage}"></p>
    </div>

    <div class="chat-body">
        <div class="message-row bot">
            <div class="message-bubble bot">
                <p>안녕하세요 yomozomo 챗봇 상담이에요.</p>
                <p>무엇을 도와드릴까요?</p>
            </div>
        </div>

    </div>

    <div class="input-area">
        <input type="text" placeholder="궁금한 내용을 입력해주세요">
        <button type="submit">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>

</div>
</body>
</html>
