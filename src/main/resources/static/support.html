<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>
    <style>
        /* 기본적인 스타일링 (예시) - 필요에 따라 수정하거나 외부 CSS 파일로 분리하세요. */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .board-header .board-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
        .write-button-area {
            text-align: right; /* 버튼을 오른쪽에 정렬 */
            margin-bottom: 20px;
        }
        .write-button-area .btn-write {
            display: inline-block; /* JavaScript로 display:none 또는 block 제어 예정 */
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .write-button-area .btn-write:hover {
            background-color: #0056b3;
        }
        .board-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .board-item {
            display: flex;
            flex-direction: column; /* 제목과 정보가 세로로 쌓이도록 */
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .board-item:last-child {
            border-bottom: none;
        }
        .board-item a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px; /* 제목과 정보 사이 간격 */
        }
        .board-item a:hover {
            color: #007bff;
        }
        .board-meta {
            font-size: 0.85em;
            color: #666;
        }
        .board-meta span {
            margin-right: 15px;
        }
        .board-meta .views {
            color: #999;
        }
        .no-posts-message {
            text-align: center;
            color: #888;
            padding: 30px;
            font-size: 1.1em;
            background-color: #f9f9f9;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="board-header">
        <div class="board-title">공지사항</div>
    </div>

    <div class="write-button-area">
        <a href="/admin/write-post" class="btn-write" id="writePostButton" style="display: none;">글쓰기</a>
    </div>

    <ul class="board-list" id="postList">
    </ul>

    <div class="no-posts-message" id="noPostsMessage">
        작성된 게시글이 없습니다.
    </div>
</div>

<script>
    // 이 스크립트는 프론트엔드에서 버튼을 숨기거나 보이게 하는 예시입니다.
    // 실제로는 서버에서 사용자 권한을 받아와 처리해야 합니다.
    document.addEventListener('DOMContentLoaded', function() {
        const writePostButton = document.getElementById('writePostButton');
        const postList = document.getElementById('postList');
        const noPostsMessage = document.getElementById('noPostsMessage');

        // --- 이 부분은 실제 개발 시 서버에서 받아온 관리자 권한 여부로 대체됩니다. ---
        // let is_admin = false; // 기본은 일반 사용자
        let is_admin = true; // 테스트를 위해 일단 관리자로 설정
        // ----------------------------------------------------------------------

        if (writePostButton) {
            if (is_admin) {
                writePostButton.style.display = 'inline-block'; // 관리자에게만 보이게
            } else {
                writePostButton.style.display = 'none'; // 일반 사용자에게는 숨김
            }
        }

        // 게시글이 없을 때 메시지 표시 여부 (초기 로드 시)
        // 실제로는 서버에서 게시글 목록을 가져온 후 postList.children.length를 확인합니다.
        if (postList.children.length === 0) {
            noPostsMessage.style.display = 'block';
        } else {
            noPostsMessage.style.display = 'none';
        }

        // --- 이 아래는 예시로 게시글을 동적으로 추가하는 함수입니다. ---
        // 실제로는 서버 API 호출을 통해 게시글 데이터를 받아와서 사용합니다.
        function addPost(title, author, date, views) {
            const newPost = document.createElement('li');
            newPost.className = 'board-item';
            newPost.innerHTML = `
                    <a href="#">${title}</a>
                    <div class="board-meta">
                        <span class="author">${author}</span>
                        <span class="date">${date}</span>
                        <span class="views">조회 ${views}</span>
                    </div>
                `;
            postList.appendChild(newPost);

            // 게시글이 추가되면 "작성된 게시글이 없습니다." 메시지를 숨김
            if (noPostsMessage) {
                noPostsMessage.style.display = 'none';
            }
        }

        // --- 개발 테스트용: 관리자가 로그인했다고 가정하고 샘플 글을 추가해볼 수 있습니다. ---
        // 이 코드는 실제 배포 시에는 제거하거나 서버에서 데이터를 가져오는 코드로 대체되어야 합니다.
        if (is_admin) {
            // 잠시 후 샘플 글 추가 (실제는 서버에서 데이터를 받아옴)
            setTimeout(() => {
                // addPost("2025 설연휴 안내", " 스토어", "2025-01-17 14:21:11", 1509);
                // addPost("새로운 공지사항", "관리자", "2025-06-07 13:00:00", 0);
                // addPost("시스템 점검 안내", " 스토어", "2025-05-20 10:00:00", 500);
            }, 1000); // 1초 후 추가 (테스트용)
        }
        // ----------------------------------------------------------------------------------
    });
</script>
</body>
</html>
