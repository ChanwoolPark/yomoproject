<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메인 페이지</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        header, footer { background: #fff; padding: 10px 20px; border-bottom: 1px solid #eee; }
        .logo { font-weight: bold; color: orange; font-size: 24px; cursor: pointer; }
        .nav { display: flex; gap: 20px; margin-left: 30px; }
        .nav a { text-decoration: none; color: black; font-weight: bold; }
        .login { margin-left: auto; }
        .banner { height: 300px; background: #5b9bd5; color: white; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        footer { border-top: 1px solid #eee; font-size: 14px; line-height: 1.6; display: flex; justify-content: space-between; }
        #topBtn { position: fixed; bottom: 20px; right: 20px; padding: 15px; border-radius: 50%; background-color: #5b9bd5; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

<header style="display: flex; align-items: center;">
    <div class="logo" onclick="location.href='/'">🥕당근</div>
    <nav class="nav">
        <a href="/category">카테고리</a>
        <a href="/login" id="loginBtn">로그인</a>
        <a href="/logout" id="logoutBtn" style="display: none;">로그아웃</a>
        <a href="/my" id="myInfoBtn" style="display: none;">내정보</a>
    </nav>
</header>

<main>
    <section class="banner">배너</section>
</main>

<footer>
    <div>
        <p>(주) 당근마켓 대표 김용현, 황도연</p>
        <p>서울특별시 구로구 디지털로 300</p>
        <p>사업자등록번호 375-87-00088</p>
    </div>
    <div>
        <p><a href="/chatbot" target="_blank">AI 챗봇</a></p>
        <p><a href="/support">고객센터</a></p>
        <p><a href="/explore">탐색</a></p>
        <p><a href="/ads">광고문의</a></p>
    </div>
</footer>

<button id="topBtn" onclick="scrollToTop()">Top<br>버튼</button>

<script>
    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 로그인 여부에 따라 버튼 표시 (임시용)
    const isLoggedIn = false; // 실제 로그인 여부 체크 로직으로 대체
    document.getElementById("loginBtn").style.display = isLoggedIn ? "none" : "inline";
    document.getElementById("logoutBtn").style.display = isLoggedIn ? "inline" : "none";
    document.getElementById("myInfoBtn").style.display = isLoggedIn ? "inline" : "none";
</script>

</body>
</html>
