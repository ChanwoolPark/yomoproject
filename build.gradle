plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.oracle.database.jdbc:ojdbc8:19.3.0.0'
    // Spring WebSocket (spring-websocket)
    implementation 'org.springframework:spring-websocket:5.3.31' // 사용하고 있는 Spring Framework 버전에 맞춰야 합니다.

    // Spring Messaging (spring-messaging) - spring-websocket에 의해 전이적으로 포함될 수 있지만, 명시적으로 추가하는 것이 좋습니다.
    implementation 'org.springframework:spring-messaging:5.3.31' // 사용하고 있는 Spring Framework 버전에 맞춰야 합니다.

    // SockJS 클라이언트와 통신하기 위해 필요 (선택 사항이지만 일반적으로 사용)
    implementation 'org.webjars:sockjs-client:1.5.1'

    // STOMP JavaScript 클라이언트 (선택 사항이지만 일반적으로 사용)
    implementation 'org.webjars:stomp-websocket:2.3.4'

    // Spring Boot를 사용한다면 spring-boot-starter-websocket 하나만 추가해도 됩니다.
    // implementation 'org.springframework.boot:spring-boot-starter-websocket'
}

tasks.named('test') {
    useJUnitPlatform()
}
